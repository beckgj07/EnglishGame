<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>精灵训练家 · 学习冒险</title>
<!--
  ============================================================
  「英语伙伴」H5 Demo v0.5 —— 单文件、零依赖、双击即玩
  对照设计文档 v3.0：双主题（宝可梦/数码宝贝）× 年级四档
  × 伙伴领养与进化 × 十模块（消消乐/默写/听力/语法/补全/
  翻翻乐/情景听力/排句子/剧场/阅读理解）
  × 12 单元岛关卡轮换 × 每日任务 × 错词本 × 手绘风 UI
  代码结构：文件头部 CONFIG 区集中管理词库/题库/伙伴数据，方便扩充
  ============================================================
-->
<style>
/* ============ 手绘风基础样式（设计文档第六节：蜡笔彩铅感） ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:"KaiTi","STKaiti","FZKai-Z03S","楷体","Microsoft YaHei",sans-serif;
  color:#5b4636;
  background-color:#fbf3e0;
  background-image:radial-gradient(rgba(120,90,40,.05) 1.2px, transparent 1.2px);
  background-size:20px 20px;
  overflow-x:hidden;
}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px;min-height:100%}
.screen{display:none;animation:pop .35s ease}
.screen.active{display:block}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}

/* 抖动描边（不规则圆角模拟手绘线条） */
.wob{border:3px solid #6b5644;border-radius:255px 18px 225px 18px/18px 225px 18px 255px}
.wob2{border:3px solid #6b5644;border-radius:18px 225px 18px 255px/255px 18px 225px 18px}
.wob3{border:3px solid #6b5644;border-radius:60% 40% 55% 45%/45% 55% 40% 60%}

/* 手写感大标题 */
h1.title{font-size:2rem;text-align:center;margin:10px 0 4px;letter-spacing:2px;text-shadow:2px 2px 0 #fff}
.subtitle{text-align:center;font-size:1rem;color:#8a715c;margin-bottom:14px}

/* 贴纸感按钮：按压=盖章 */
.btn{
  display:inline-block;font-family:inherit;font-size:1.15rem;font-weight:bold;color:#5b4636;
  background:#ffd95e;padding:12px 22px;cursor:pointer;user-select:none;
  border:3px solid #6b5644;border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
  box-shadow:0 5px 0 #6b5644;transform:rotate(-.6deg);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(4px) rotate(-.6deg) scale(.97);box-shadow:0 1px 0 #6b5644}
.btn.green{background:#b8e986}.btn.pink{background:#ffb3c1}.btn.blue{background:#a8dcf5}
.btn.orange{background:#ffc38a}.btn.small{font-size:.95rem;padding:8px 14px;box-shadow:0 3px 0 #6b5644}
.btn.small:active{transform:translateY(2px);box-shadow:0 1px 0 #6b5644}
.btn.big{font-size:1.35rem;padding:15px 30px}
.btn:disabled{opacity:.45;cursor:default}
.backbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}

/* 主题/年级/伙伴选择卡片 */
.card-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:16px 0}
.card{
  flex:1 1 150px;max-width:230px;background:#fffdf6;padding:18px 12px;text-align:center;cursor:pointer;
  border:3px solid #6b5644;border-radius:18px 225px 18px 255px/255px 18px 225px 18px;
  box-shadow:0 5px 0 rgba(107,86,68,.9);transition:transform .12s;
}
.card:active{transform:translateY(4px) rotate(-1deg);box-shadow:0 1px 0 rgba(107,86,68,.9)}
.card .big-ico{font-size:2.6rem;line-height:1.2}
.card h3{font-size:1.3rem;margin:6px 0 4px}
.card p{font-size:.9rem;color:#8a715c}
.card.selected{background:#fff3c2;outline:4px dashed #e8a33d;outline-offset:-10px}

/* 伙伴形象：贴纸效果 + 素材槽 */
.pet-art{
  width:150px;height:150px;margin:0 auto;display:flex;align-items:center;justify-content:center;
  background:#fff;padding:6px;border:4px solid #fff;outline:3px solid #d9c9a8;
  border-radius:12px;box-shadow:3px 5px 10px rgba(107,86,68,.28);
  transform:rotate(-2deg);
}
.pet-art.large{width:210px;height:210px}
.pet-art .pet-img,.pet-art svg{width:100%;height:100%;object-fit:contain}
/* 进化图鉴：未解锁阶段显示剪影 */
.dex-card{background:#fffdf6;border:3px solid #d8c7a8;border-radius:22px;padding:14px 12px;margin:12px 0;box-shadow:3px 4px 0 rgba(107,86,68,.12)}
.dex-card.mine{border-color:#f0b429;background:#fffbea}
.dex-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.dex-head h3{margin:0}
.dex-row{display:flex;justify-content:space-around;gap:4px;flex-wrap:wrap}
.dex-stage{width:31%;min-width:96px;text-align:center}
.dex-stage .pet-art{width:88px;height:88px;margin:0 auto}
.dex-stage .nm{font-size:.95rem;font-weight:bold;color:#5b4636;margin-top:2px}
.dex-stage .tp{font-size:.78rem;color:#8a715c}
.dex-stage.cur .nm{color:#e07b2f}
.dex-stage .badge-cur{display:inline-block;font-size:.72rem;background:#f0b429;color:#fff;border-radius:8px;padding:1px 6px;margin-left:3px;vertical-align:middle}
.sil{filter:brightness(0) opacity(.22)}
.dex-lock{font-size:.78rem;color:#b0a08c;margin-top:2px}
/* 官方插图 PNG：白底用 multiply 融入纸张 */
.wart{display:block;width:100%;height:100%}
.wart img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.petsvg{filter:url(#wobf)}
.pet-name{font-size:1.35rem;font-weight:bold;margin-top:10px;text-align:center}
.pet-type{display:inline-block;background:#ffe9a8;border:2px solid #6b5644;border-radius:14px 60px 14px 60px;padding:2px 12px;font-size:.9rem;margin-top:4px}
.pet-desc{text-align:center;font-size:.95rem;color:#7a6350;margin-top:8px}

/* 能量条 */
.energy-wrap{margin:12px auto 4px;max-width:340px}
.energy-label{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:4px}
.energy-track{height:22px;background:#efe3c8;border:3px solid #6b5644;border-radius:40px 12px 40px 12px;overflow:hidden}
.energy-fill{height:100%;background:repeating-linear-gradient(45deg,#ffcf5c,#ffcf5c 10px,#ffd976 10px,#ffd976 20px);
  border-right:2px solid #b8862f;transition:width .6s ease;width:0}

/* 伙伴对话气泡 */
.bubble{
  position:relative;background:#fffdf6;border:3px solid #6b5644;
  border-radius:16px 100px 16px 100px/100px 16px 100px 16px;
  padding:10px 16px;margin:14px auto 0;max-width:340px;font-size:1.05rem;text-align:center;
}
.bubble:after{content:"";position:absolute;top:-14px;left:50%;margin-left:-8px;
  border:8px solid transparent;border-bottom-color:#6b5644}

/* 顶部信息条 */
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;
  background:#fff3cf;border:3px solid #6b5644;border-radius:14px 90px 14px 90px/90px 14px 90px 14px;
  padding:8px 14px;margin-bottom:12px;font-size:1rem}
.pill{display:inline-block;background:#fffdf6;border:2px solid #6b5644;border-radius:20px 8px 20px 8px;padding:2px 10px;margin:2px;font-size:.92rem}

/* 关卡地图 */
.island{background:#fffdf6;border:3px solid #6b5644;border-radius:20px 120px 20px 120px/120px 20px 120px 20px;
  padding:12px 14px;margin:14px 0;box-shadow:0 4px 0 rgba(107,86,68,.5)}
.island.locked{opacity:.55;filter:grayscale(.6)}
.island h3{font-size:1.2rem;margin-bottom:8px}
.level-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.node{
  width:74px;padding:8px 4px;text-align:center;cursor:pointer;background:#ffe08a;user-select:none;
  border:3px solid #6b5644;border-radius:40% 60% 55% 45%/50% 45% 60% 50%;box-shadow:0 4px 0 #6b5644;
}
.node:active{transform:translateY(3px);box-shadow:0 1px 0 #6b5644}
.node.locked{background:#e3d8c2;cursor:default;box-shadow:0 2px 0 #b3a48c}
.node .lv{font-size:.85rem;font-weight:bold}
.node .stars{font-size:.8rem;letter-spacing:-1px}

/* 题目区 */
.q-card{background:#fffdf6;padding:18px 16px;margin-top:8px;text-align:center;
  border:3px solid #6b5644;border-radius:24px 100px 24px 100px/100px 24px 100px 24px;box-shadow:0 5px 0 rgba(107,86,68,.5)}
.q-word{font-size:2rem;letter-spacing:3px;font-weight:bold;margin:8px 0}
.q-emoji{font-size:4rem;line-height:1.2;margin:10px 0}
.q-hint{color:#8a715c;font-size:1rem;margin-bottom:8px}
.q-art{width:136px;height:136px;margin:10px auto}
.q-art .illsvg{width:100%;height:100%;display:block}
/* v2.9 统一喇叭按钮（全 APP speak 触发）：32px 圆形手绘描边，.big 40px 用于详情页头部 */
.spk-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#FFB43A;border:2px solid #5B4A36;cursor:pointer;flex:none;vertical-align:middle;box-sizing:border-box;transition:transform .08s}
.spk-btn:active{transform:scale(0.9)}
.spk-btn svg{width:14px;height:14px;display:block;pointer-events:none}
.spk-btn.big{width:40px;height:40px}
.spk-btn.big svg{width:18px;height:18px}
/* v2.9 属性小课堂双语两行：英文 13px 上 / 中文 11px 灰下 */
.les-en{font-size:13px;font-weight:500;color:#4A3B28;display:flex;align-items:center;gap:6px;font-family:Georgia,serif}
.les-zh{font-size:11px;color:#8A7A62;margin-top:1px}
/* v2.9 伙伴页：头部芯片行 + 两列操作网格 */
.pet-chips{display:flex;justify-content:center;gap:6px;margin:6px 0 0}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:#fff;border:1.5px solid #5B4A36;font-size:10px;font-weight:600;color:#5B4A36;white-space:nowrap}
.pet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.pact{height:56px;border-radius:12px;border:2px solid #5B4A36;background:#fff;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;overflow:hidden;cursor:pointer;transition:transform .08s;font-weight:600;font-size:12px;color:#5B4A36;box-sizing:border-box}
.pact:active{transform:scale(0.97)}
.pact .sub{font-size:9px;font-weight:400;color:#8A7A62}
/* v2.13 喂养/训练两行式：主文字 15px 视觉主角 + 副文字 10px 灰 */
.pact.two{flex-direction:column;gap:1px}
.pact.two .main{font-size:15px;font-weight:500;line-height:1.1}
.pact.two .sub{font-size:10px}
.pact.evo{grid-column:span 2;background:#FFB43A}
.pact.evo .sub{color:#5B4A36}
.pact.dis{background:#e3d8c2;opacity:.75}
/* ===== v2.13 交互打磨 ===== */
/* 转场：二级页 push 右滑入 / pop 右滑出（旧屏垫底）/ Tab 淡入 —— GPU transform 合成 */
#app{position:relative;overflow-x:hidden}
.screen-under{position:absolute;top:0;left:0;right:0;z-index:0;pointer-events:none;overflow:hidden}
.screen-over{position:absolute;top:0;left:0;right:0;z-index:2;pointer-events:none;overflow:hidden}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes popOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes fadeInScr{from{opacity:0}to{opacity:1}}
.anim-push{animation:pushIn 180ms ease-out}
.anim-pop-out{animation:popOut 180ms ease-out forwards}
.anim-fade{animation:fadeInScr 120ms ease-out}
/* 统一确认弹窗（替代原生 confirm） */
.dlg-mask{position:fixed;inset:0;background:rgba(43,32,20,.45);z-index:999;display:flex;align-items:center;justify-content:center;animation:fadeInScr 150ms ease-out}
.dlg-mask.out{opacity:0;transition:opacity 150ms ease-out}
@keyframes dlgPop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.dlg-card{background:#fff;border:2px solid #5B4A36;border-radius:16px;padding:16px;width:min(84%,320px);animation:dlgPop 150ms ease-out}
.dlg-title{font-size:15px;font-weight:500;color:#4A3B28;margin-bottom:6px}
.dlg-msg{font-size:13px;color:#6b5644;line-height:1.6;white-space:pre-line}
.dlg-btns{display:flex;gap:8px;margin-top:14px}
.dlg-btn{flex:1;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.dlg-btn.cancel{background:#fff;border:2px solid #5B4A36;color:#5B4A36}
.dlg-btn.ok{background:#FFB43A;border:2px solid #5B4A36;color:#5B4A36}
.dlg-btn:active{transform:scale(0.96)}
/* 进化图鉴卡片墙：每链一张全宽大卡 */
.evo-card{position:relative;background:#fff;border:2px solid #5B4A36;border-radius:16px;padding:14px;margin-bottom:12px}
.evo-card .evo-bigimg{display:flex;justify-content:center}
.evo-card .evo-bigimg .dex-img,.evo-card .evo-bigimg .pet-art{width:120px;height:120px}
.evo-card .dex-img.big,.evo-card .dex-img.big .dex-img{width:120px;height:120px}
.evo-nm{text-align:center;font-size:14px;font-weight:500;color:#4A3B28;margin-top:6px}
.evo-en{font-size:11px;color:#8a715c;font-family:Georgia,serif;font-weight:400}
.evo-steps{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px}
.evo-arrow{color:#b8a488;font-size:16px;font-weight:bold;flex:none}
.evo-step{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer}
.evo-step:active{transform:scale(0.94)}
.evo-step .dex-img,.evo-step .pet-art{width:56px;height:56px}
.evo-step .dex-img{border-radius:50%;overflow:hidden;border:2px solid transparent}
.evo-step.cur .dex-img{border-color:#FFB43A}
.evo-badge{font-style:normal;font-size:9px;background:#FFB43A;color:#5B4A36;border-radius:8px;padding:1px 5px;margin-top:2px;white-space:nowrap;font-weight:600}
.evo-step.dis{opacity:.45;filter:grayscale(.7)}
/* v2.15 图鉴子页签 + 卡头横排 + 好感条（设计稿定稿版式） */
.dex-tabs{display:flex;gap:8px;justify-content:center;margin:10px 0 12px}
.dex-tab{flex:1;max-width:170px;text-align:center;padding:8px 0;border:2px solid #6b5644;border-radius:16px 6px 16px 6px;background:#fffdf6;font-weight:600;color:#6b5644;cursor:pointer;font-size:.95rem}
.dex-tab:active{transform:scale(.96)}
.dex-tab.on{background:#7cb342;color:#fff}
.dex-stat{display:flex;gap:8px;margin-bottom:12px}
.dex-stat>div{flex:1;background:#fff;border:2px solid #5B4A36;border-radius:12px;padding:8px 4px;text-align:center}
.dex-stat .n{font-size:1.1rem;font-weight:bold;color:#4A3B28}
.dex-stat .l{font-size:.72rem;color:#8a715c;margin-top:2px}
.evo-head{display:flex;align-items:center;gap:10px}
.evo-himg{flex:none}
.evo-himg .dex-img,.evo-himg .pet-art{width:56px;height:56px}
.evo-ht{flex:1;min-width:0}
.evo-ht .nm{font-size:15px;font-weight:600;color:#4A3B28}
.evo-tp{font-size:.75rem;color:#8a715c;margin-top:2px}
.evo-flag2{display:inline-block;background:#f0b429;color:#5B4A36;border-radius:8px;padding:1px 8px;font-size:10px;font-weight:700;margin-top:3px;font-style:normal}
.evo-ready{border-color:#f0b429;box-shadow:0 0 0 3px #fde9bd}
.evo-step{position:relative}
.evo-q{width:56px;height:56px;border-radius:50%;background:#eee2cc;color:#b8a488;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:bold;margin:0 auto}
.evo-alert{position:absolute;top:-5px;right:2px;background:#f0b429;color:#5B4A36;border-radius:50%;width:18px;height:18px;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #fff;font-style:normal}
.evo-step .snm{font-style:normal;font-size:.68rem;color:#8a715c;margin-top:2px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evo-affwrap{margin-top:10px}
.evo-affrow{display:flex;align-items:center;gap:8px}
.evo-affbar{flex:1;height:8px;background:#eee2cc;border-radius:4px;overflow:hidden}
.evo-affbar>div{height:100%;background:#D4537E;border-radius:4px}
.evo-affv{font-size:.78rem;color:#c25b8a;font-weight:600;white-space:nowrap}
.evo-affhint{font-size:.74rem;color:#8a715c;margin-top:4px}
.evo-go{display:block;background:#7cb342;color:#fff;text-align:center;border-radius:12px;padding:10px 0;margin-top:10px;font-weight:700;cursor:pointer}
.evo-go:active{transform:scale(.97)}
.dex-bar{display:flex;align-items:center;gap:8px;margin:6px 0}
.dex-bar .nm{flex:none;font-size:.82rem;font-weight:600;color:#4A3B28;width:64px}
.dex-bar .bar{flex:1;height:8px;background:#eee2cc;border-radius:4px;overflow:hidden}
.dex-bar .bar>div{height:100%;background:#7cb342;border-radius:4px}
.dex-bar .st{flex:none;font-size:.72rem;color:#8a715c;white-space:nowrap}
.evo-aff{text-align:right;font-size:10px;color:#c25b8a;margin-top:8px}
.opt.art{padding:10px 4px}
.opt.art .illsvg{width:78px;height:78px;margin:0 auto;display:block}
.opt.art .olab{font-size:.9rem;margin-top:2px;color:#7a6350;font-family:Georgia,"KaiTi",serif}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{
  font-family:inherit;font-size:1.5rem;background:#fff3cf;cursor:pointer;padding:14px 6px;user-select:none;
  border:3px solid #6b5644;border-radius:30px 12px 30px 12px;box-shadow:0 4px 0 #6b5644;transition:transform .08s;
}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #6b5644}
.opt.txt{font-size:1.3rem;font-family:Georgia,"KaiTi",serif;letter-spacing:1px}
.opt.right{background:#b8e986}
.opt.wrong{background:#ffb3b3}
.progress-line{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:1rem}
.ptrack{flex:1;height:14px;background:#efe3c8;border:2px solid #6b5644;border-radius:20px;overflow:hidden}
.pfill{height:100%;background:#8fce6e;transition:width .3s}
.combo-tag{display:inline-block;background:#ff9f43;color:#fff;font-weight:bold;border:2px solid #6b5644;
  border-radius:14px 6px 14px 6px;padding:1px 10px;animation:bump .3s ease}
@keyframes bump{0%{transform:scale(1.5)}100%{transform:scale(1)}}

/* 默写字母块 */
.letter-zone{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  background:#fdf7e6;border:3px dashed #b3a48c;border-radius:18px;padding:10px;margin:10px 0}
.tile{
  width:52px;height:52px;font-size:1.6rem;font-weight:bold;display:flex;align-items:center;justify-content:center;
  background:#fff;border:3px solid #6b5644;border-radius:14px 6px 14px 6px;box-shadow:0 4px 0 #6b5644;
  cursor:pointer;user-select:none;font-family:Georgia,serif;text-transform:uppercase;
}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #6b5644}
.tile.used{opacity:.25;pointer-events:none}
.tile.ghost{background:transparent;border-style:dashed;box-shadow:none;cursor:default}
.dict-input{
  font-family:Georgia,serif;font-size:1.6rem;text-align:center;letter-spacing:3px;width:100%;max-width:320px;
  padding:10px;border:3px solid #6b5644;border-radius:14px 6px 14px 6px;background:#fffdf6;color:#5b4636;text-transform:lowercase;
}

/* 答题反馈 */
.fb{margin-top:14px;padding:12px;border-radius:16px;font-size:1.1rem;font-weight:bold;display:none}
.fb.ok{display:block;background:#d9f2c2;border:3px solid #4a7a34;border-radius:16px 80px 16px 80px/80px 16px 16px 80px}
.fb.no{display:block;background:#ffe0e0;border:3px solid #b03a3a;border-radius:16px 80px 16px 80px/80px 16px 16px 80px}
.fb .ans{font-size:1.3rem;letter-spacing:2px}

/* 每日任务 */
.tasks{background:#fffdf6;border:3px solid #6b5644;border-radius:18px 90px 18px 90px/90px 18px 90px 18px;padding:10px 14px;margin:14px 0}
.tasks h4{margin-bottom:6px}
.task-line{font-size:.98rem;padding:3px 0}
.task-line.done{color:#4a8a2f}

/* 模块快捷入口 */
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.mod-btn{background:#fffdf6;padding:12px 8px;text-align:center;cursor:pointer;font-size:1.05rem;font-weight:bold;
  border:3px solid #6b5644;border-radius:20px 80px 20px 80px/80px 20px 80px 20px;box-shadow:0 4px 0 #6b5644}
.mod-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6b5644}
.mod-btn .mi{font-size:1.8rem;display:block;margin-bottom:4px}

/* Toast */
#toast{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);background:#5b4636;color:#fff;
  padding:10px 22px;font-size:1.05rem;border-radius:16px 4px 16px 4px;display:none;z-index:60;max-width:88%;text-align:center}

/* 庆祝全屏覆盖层 */
#overlay{position:fixed;inset:0;background:rgba(251,243,224,.96);display:none;z-index:50;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden}
#overlay.show{display:flex}
.cele-title{font-size:2rem;font-weight:bold;color:#e07b2f;text-shadow:2px 2px 0 #fff;margin:14px 0 6px;animation:bump .5s ease}
.cele-sub{font-size:1.25rem;color:#7a6350;margin-bottom:18px}
.confetti{position:absolute;top:-40px;font-size:1.6rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.aura{animation:glow 1.6s ease infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 4px #ffd85e)}to{filter:drop-shadow(0 0 18px #ffb03a)}}

/* 听力降级提示 */
.degrade{background:#ffe9c9;border:3px dashed #e8a33d;border-radius:16px;padding:10px;font-size:.98rem;margin:10px 0}

/* ===== 新模块样式（v0.5：补全/翻翻乐/情景听力/排句子/剧场/阅读） ===== */
/* 单词补全：缺字母空槽 */
.pz-word{font-size:2.3rem;letter-spacing:5px;font-weight:bold;font-family:Georgia,serif;margin:8px 0}
.pz-blank{display:inline-block;min-width:1.1em;border-bottom:4px solid #e8a33d;color:transparent;text-align:center}
.pz-blank.cur{background:#fff3c2;border-bottom-color:#e8452c;color:transparent}
.pz-blank.filled{color:#4a7a34;border-bottom-color:#4a7a34}
/* 卡牌翻翻乐 4×2 */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:430px;margin:12px auto}
.mcard{height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#ffe08a;border:3px solid #6b5644;border-radius:14px 6px 14px 6px;box-shadow:0 4px 0 #6b5644;
  cursor:pointer;font-size:1.05rem;font-weight:bold;user-select:none;transition:transform .12s;overflow:hidden;padding:2px}
.mcard:active{transform:translateY(3px);box-shadow:0 1px 0 #6b5644}
.mcard.back{background:#e3d8c2;color:transparent}
.mcard.done{background:#b8e986;pointer-events:none}
.mcard .mzh{font-size:.92rem;color:#8a715c;font-weight:normal}
.mcard.back .mzh{color:transparent}
/* 句子排排队：词块（复用 .letter-zone 容器） */
.sword{display:inline-block;padding:7px 13px;font-size:1.15rem;font-weight:bold;font-family:Georgia,serif;
  background:#fff;border:3px solid #6b5644;border-radius:12px 6px 12px 6px;box-shadow:0 3px 0 #6b5644;
  cursor:pointer;user-select:none}
.sword:active{transform:translateY(2px);box-shadow:0 1px 0 #6b5644}
.sword.used{opacity:.25;pointer-events:none}
/* 情景听力 / 剧场：中文情景说明条 */
.scene-note{background:#fff3cf;border:2px solid #e8a33d;border-radius:14px 60px 14px 60px;padding:8px 14px;
  font-size:1rem;margin:8px 0;text-align:center}
.scene-line{font-family:Georgia,"KaiTi",serif;font-size:1.15rem;text-align:left;margin:6px 0;padding:0 8px}
.scene-line b{color:#2f6fa8}
.scene-line .blank-slot{display:inline-block;min-width:84px;border-bottom:3px solid #b8862f;color:#b8862f;text-align:center}
/* 阅读理解：短文卡 + 生词 */
.rpass{background:#fffdf6;border:3px solid #6b5644;border-radius:18px 90px 18px 90px/90px 18px 90px 18px;
  padding:12px 16px;font-size:1.12rem;line-height:1.9;margin:8px 0;text-align:left}
.rpass h4{font-size:1.1rem;margin-bottom:4px;text-align:center}
.rpass .gloss{color:#2f6fa8;border-bottom:2px dotted #2f6fa8;cursor:pointer;font-weight:bold}

@media (max-width:420px){
  .q-word{font-size:1.6rem}.q-emoji{font-size:3.2rem}
  .tile{width:44px;height:44px;font-size:1.3rem}
  .pet-art{width:120px;height:120px}
}

/* ============ v2.0 APP 壳层：四 Tab 导航 + 新版视图 ============ */
body.tabbed #app{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;
  display:flex;background:#fffdf6;border-top:3px solid #6b5644;
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:56px;gap:1px;cursor:pointer;user-select:none;font-family:inherit;
  font-size:.82rem;color:#8a715c;background:none;border:none;padding:0;
}
.tabbar .tab .ti{font-size:1.5rem;line-height:1.25}
.tabbar .tab.on{color:#e07b2f;font-weight:bold}
.tabbar .tab.on .ti{transform:scale(1.12)}
/* 触控目标兜底：所有可点元素 ≥48px */
.opt{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.btn,.mod-btn,.node,.tabbar .tab{min-height:48px}
/* 首页：问候行 + 状态卡 + 大 CTA */
.home-greet{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;flex-wrap:wrap;gap:6px}
.home-greet h2{font-size:1.25rem;letter-spacing:1px}
.stat-chip{display:inline-block;background:#fff3cf;border:2px solid #6b5644;border-radius:20px 8px 20px 8px;padding:3px 12px;font-size:.95rem;margin-left:6px}
.home-card{background:#fffdf6;border:3px solid #6b5644;border-radius:20px 120px 20px 120px/120px 20px 120px 20px;
  padding:12px 14px;margin:12px 0;box-shadow:0 4px 0 rgba(107,86,68,.5)}
.big-cta{display:block;width:100%;text-align:center;font-size:1.5rem;padding:18px 10px;margin:14px 0 6px;
  background:#8fce6e;border:4px solid #4a8a2f;color:#2f5a1c;border-radius:24px 90px 24px 90px/90px 24px 90px 24px;
  box-shadow:0 6px 0 #4a8a2f;cursor:pointer;user-select:none;font-family:inherit;font-weight:bold;letter-spacing:2px}
.big-cta:active{transform:translateY(4px);box-shadow:0 2px 0 #4a8a2f}
.big-cta small{display:block;font-size:.85rem;font-weight:normal;color:#3d6b26;letter-spacing:0}
/* 冒险：竖向岛屿路径 */
.island-node{background:#fffdf6;border:3px solid #6b5644;border-radius:20px 120px 20px 120px/120px 20px 120px 20px;
  padding:10px 12px;margin:16px 0;box-shadow:0 4px 0 rgba(107,86,68,.5);cursor:pointer}
.island-node.locked{opacity:.55;filter:grayscale(.6)}
.island-node .head{display:flex;align-items:center;gap:8px}
.island-node .head .ico{font-size:1.7rem}
.island-node .head h3{font-size:1.15rem;flex:1;margin:0}
.island-node .arrow{font-size:1.3rem;color:#b0a08c}

.evo-chain{display:flex;justify-content:space-around;align-items:flex-end;gap:4px;margin:10px 0}
.evo-step{width:31%;min-width:92px;text-align:center}

function $(id){ return document.getElementById(id); }
function shuffle(arr){

 * 创建失败静默降级；静音开关只关音效、不影响 TTS
 * ================================================================== */
var ACTX = null;
function audioCtx(){
  if(S.save && S.save.sound === false) return null;
  if(!ACTX){
    try{ ACTX = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ ACTX = null; }
    if(!ACTX) return null;
  }
  if(ACTX.state === "suspended"){ try{ ACTX.resume(); }catch(e){} }
  return ACTX;
}
function tone(freq, start, dur, vol, type){
  var ctx = audioCtx(); if(!ctx) return;
  try{
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    var t0 = ctx.currentTime + start;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }catch(e){}
}
function sfx(name){
  if(S.save && S.save.sound === false) return;
  if(name==="ok"){ tone(660,0,.12,.16); tone(880,.09,.15,.16); }                       // 答对：两音上行叮咚
  else if(name==="no"){ tone(220,0,.2,.08,"triangle"); }                                // 答错：柔和低音
  else if(name==="star3"){ tone(523,0,.12,.15); tone(659,.12,.12,.15); tone(784,.24,.22,.15); } // 3星：三音上行
  else if(name==="evolve"){ [392,494,587,784].forEach(function(f,i){ tone(f,i*.13,.18,.14); }); } // 进化：上行琶音
  else if(name==="ach"){ tone(1047,0,.1,.13); tone(1319,.1,.18,.13); }                  // 成就：清脆双音
}
function toggleSound(){
  S.save.sound = (S.save.sound === false); // true→false、false→true（undefined 视为开，切后为关）
  saveGame();
  if(S.save.sound) sfx("ok");
  show("home");
  toast(S.save.sound ? "🔊 音效已开启" : "🔇 音效已关闭（朗读不受影响）");
}

function petMeta(theme, petKey){
  return THEMES[theme].pets.filter(function(p){ return p.key===petKey; })[0];
}
/* 生成伙伴的手绘 SVG 占位形象（原创简笔小生物，大眼睛，阶段变化） */

  var m = petMeta(theme, petKey);
  var max = THEMES[theme].stages.length;
  var ci = Math.min(stage-1, m.colors.length-1);

    if(s>=2) acc += '<path d="M24 68 q-12 -4 -16 -13 q12 1 18 6 z" fill="#4aa3e0" stroke="#2a6f9e" stroke-width="2"/>'
                  + '<path d="M96 68 q12 -4 16 -13 q-12 1 -18 6 z" fill="#4aa3e0" stroke="#2a6f9e" stroke-width="2"/>';
    if(s>=3) acc += '<path d="M50 32 l-4 -12 l8 5 l4 -9 l4 9 l8 -5 l-4 12 z" fill="#ffd85e" stroke="#d4a02f" stroke-width="2"/>';
  }else if(m.acc === "antenna"){

                  + '<path d="M80 30 q8 -12 -2 -18 q-6 8 -4 16 z" fill="'+cd+'" stroke="#5b4636" stroke-width="2"/>';

  }else if(m.acc === "ear"){

        + '<path d="M78 34 q10 -14 -2 -20 q-10 6 -10 18 z" fill="'+cd+'" stroke="#5b4636" stroke-width="2"/>';
    if(s>=3) acc += '<circle cx="60" cy="14" r="4" fill="#ffe07a" stroke="#5b4636" stroke-width="2"/>';
  }else if(m.acc === "wave"){
    acc = '<path d="M46 32 q7 -8 14 0 q7 -8 14 0" fill="none" stroke="#2f9c8d" stroke-width="3"/>';
    if(s>=2) acc += '<path d="M42 26 q9 -9 18 0 q9 -9 18 0" fill="none" stroke="#2f9c8d" stroke-width="2.5"/>';

/* 伙伴形象容器：先尝试加载官方 PNG（assets/<theme>/<theme>_<slot>_<stage>.png），失败回退 SVG */
function petArt(theme, petKey, stage, cls){
  return '<div class="pet-art '+(cls||"")+'" data-t="'+theme+'" data-p="'+petKey+'" data-s="'+stage+'"></div>';
}
function mountPetArts(){
  var nodes = document.querySelectorAll(".pet-art:not(.mounted)");
  for(var i=0;i<nodes.length;i++){
    var el = nodes[i];
    el.classList.add("mounted");
    var t = el.getAttribute("data-t"), p = el.getAttribute("data-p"), s = +el.getAttribute("data-s");
    var m = petMeta(t, p);
    var path = "assets/" + t + "/" + t + "_" + m.slot + "_" + s + ".png";
    var im = new Image();
    im.onload = (function(node, img){
      return function(){ img.className = "pet-img"; node.innerHTML=""; node.appendChild(img); };
    })(el, im);
    im.onerror = (function(node, th, pk, st){
      return function(){ node.innerHTML = petSVG(th, pk, st); };
    })(el, t, p, s);
    im.src = path;
  }
}

 * 手绘插图引擎 ILLUSTRATIONS（替代 emoji，全部原创 SVG 简笔画）
 * 统一 viewBox 0 0 100 100；粗描边 + 平涂色块 + 抖动滤镜（#wobf）
 * art 规格格式："<家族>:<变体>#<主色>,<辅色>"
 * ================================================================== */
var ILLUS = {};
function illParse(rest, d1, d2){
  var h = rest.indexOf("#");
  var v = h>=0 ? rest.slice(0,h) : rest;
  var seg = h>=0 ? rest.slice(h+1) : "";
  var cs = seg.split(",");
  return { v:v, c:cs[0]||d1, c2:cs[1]||cs[0]||d1 };
}
function illWrap(inner){
  return '<svg viewBox="0 0 100 100" class="illsvg" xmlns="http://www.w3.org/2000/svg">'
    + '<g filter="url(#wobf)" stroke="#4a3226" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' + inner + '</g></svg>';
}
function illEyes(x1, x2, y, r){
  return '<circle cx="'+x1+'" cy="'+y+'" r="'+r+'" fill="#fff" stroke="#5b4636" stroke-width="2.5"/>'
    + '<circle cx="'+x2+'" cy="'+y+'" r="'+r+'" fill="#fff" stroke="#5b4636" stroke-width="2.5"/>'
    + '<circle cx="'+(x1+1.5)+'" cy="'+(y+1)+'" r="'+(r*0.42)+'" fill="#3a2e26"/>'
    + '<circle cx="'+(x2+1.5)+'" cy="'+(y+1)+'" r="'+(r*0.42)+'" fill="#3a2e26"/>';
}

  return illWrap(ILLUS._default(rest));

function hasRealArt(w){
  /* v2.8：真图判定（属性圆图标算可用图）；无图词走纯文字卡 */
  return (w.art && String(w.art).indexOf("type:") === 0) || !!(window.ART_OK && window.ART_OK[(w.en||"").toLowerCase()]);
}
function artHTML(w, mode){
  /* v2.7：无真图词走纯文字版式卡，不再渲染占位 SVG/圆形头图形；真图词走 mountWordArts 图片路径
     v2.8 语言纯度：mode="en" 纯英文卡（听力选项，听音不剧透）；mode="zh" 纯中文卡（看词选意选项）；
     默认全卡（题干/答案展示用）。选项侧一律单一语言，杜绝 en+zh 混排送分 */
  var isTypeArt = w.art && String(w.art).indexOf("type:") === 0;
  if(!hasRealArt(w)){
    if(mode === "en") return '<span class="wart-txt"><b class="wt-en">' + w.en + '</b></span>';
    if(mode === "zh") return '<span class="wart-txt"><span class="wt-zh">' + (w.zh||"") + '</span></span>';
    return '<span class="wart-txt"><b class="wt-en">' + w.en + '</b>'
      + (w.phonetic ? '<span class="wt-ph">' + w.phonetic + '</span>' : '')
      + '<span class="wt-zh">' + (w.zh||"") + '</span></span>';
  }
  return '<span class="wart" data-en="' + w.en + '">' + artOf(w) + '</span>';
}
function mountWordArts(){
  var nodes = document.querySelectorAll(".wart:not(.mounted)");
  for(var i=0;i<nodes.length;i++){
    var el = nodes[i];
    el.classList.add("mounted");
    var en = el.getAttribute("data-en");
    var im = new Image();
    im.onload = (function(node, img){
      return function(){ node.innerHTML = ""; node.appendChild(img); };
    })(el, im);
    im.onerror = (function(){ return function(){ /* PNG 缺失：保留手绘 SVG */ }; })();
    im.src = "assets/illustrations/" + en + ".png";
  }
}

ILLUS.num = function(rest){
  var v = rest.split("#")[0];
  var n = NUM_WORDS[v] || 1;
  var label = v.charAt(0).toUpperCase() + v.slice(1);
  var dots = "";
  var show = Math.min(n, 10);
  var startX = 50 - (show-1)*9/2;
  for(var i=0;i<show;i++){
    dots += '<circle cx="'+(startX + i*9)+'" cy="84" r="4" fill="#ff9f43" stroke="#5b4636" stroke-width="2"/>';
  }
  if(n>10) dots += '<text x="84" y="89" font-size="11" fill="#8a715c" font-family="Georgia">+'+(n-10)+'</text>';
  return '<path d="M30 22 q20 -14 40 0 q14 10 0 24 q-14 14 -40 0 q-14 -10 0 -24 z" fill="#fff3c2" stroke="#5b4636" stroke-width="3"/>'
    + '<text x="50" y="46" text-anchor="middle" font-size="30" font-weight="bold" font-family="Georgia" fill="#5b4636">'+label+'</text>'
    + dots;
};

/* ==================================================================
 * 出题引擎（词库驱动模板生成，避免立即重复，错词本优先）
 * ================================================================== */
/* ---------- v0.8 培优/拔高词库门控 ----------
   培优词：任一岛集星 ≥12/15（ISLAND_STAR_GOAL）后解锁
   拔高词：冒险家等级 Lv = ⌊总星÷6⌋+1 ≥ 8（即总星 ≥42）后解锁
   门控在取词源头统一过滤：gradeWords / pickWords 跨档兜底 / distractors */
var ADV_LV_GOAL = 8;      // 拔高解锁等级
var LV_STAR_STEP = 6;     // 等级公式：每 6 星升 1 级
function sumStars(){ var t=0; for(var k in S.save.stars) t += S.save.stars[k]; return t; }
function adventurerLevel(){ return Math.floor(sumStars()/LV_STAR_STEP)+1; }
function premiumUnlocked(){
  var islands = THEMES[S.theme] ? THEMES[S.theme].islands : [];
  for(var i=0;i<islands.length;i++){ if(islandStars(i) >= ISLAND_STAR_GOAL) return true; }
  return false;
}
function advancedUnlocked(){ return adventurerLevel() >= ADV_LV_GOAL; }
function wordUnlocked(w){
  if(!w || !w.level) return true;
  if(w.level==="培优") return premiumUnlocked();
  if(w.level==="拔高") return advancedUnlocked();
  return true;
}
/* ---------- v0.8 家长自定义词表（localStorage 按主题存，出题时并入当前档词池） ---------- */
function customKey(theme){ return "englishBuddy_custom_" + theme; }
var CUST_CACHE = null;
function customWords(){
  if(CUST_CACHE) return CUST_CACHE;
  try{
    var raw = localStorage.getItem(customKey(S.theme));
    CUST_CACHE = raw ? JSON.parse(raw) : [];
  }catch(e){ CUST_CACHE = []; }
  return CUST_CACHE;
}
function refreshCustom(){ CUST_CACHE = null; }
function gradeWords(){ // 当前存档年级的词（含家长自定义词 + v2.1 属性英语词，过滤未解锁培优/拔高）
  var base = WORDS.filter(function(w){ return w.grade === S.save.grade && wordUnlocked(w); });
  var seen = {};
  base.forEach(function(w){ seen[w.en.toLowerCase()] = 1; });
  customWords().forEach(function(w){
    if(w.grade === S.save.grade && !seen[w.en.toLowerCase()]){
      base.push(w);
      seen[w.en.toLowerCase()] = 1;
    }
  });
  /* v2.1 属性英语联动：18 属性英文词注入当前档词池（跟随年级档），
     与课本/自定义词 en 重复的跳过（大小写不敏感），避免消消乐出题歧义 */
  if(window.DEX_TYPES){
    Object.keys(window.DEX_TYPES).forEach(function(t){
      var ty = window.DEX_TYPES[t];
      var en = ty.en.toLowerCase();
      if(seen[en]) return;
      seen[en] = 1;
      base.push({ en: en, zh: t + "属性", grade: S.save.grade, topic: "属性",
        level: "基础", unit: "U01", art: "type:" + t });
    });
  }
  return base;
}
function pickWords(n, topics){
  // 1) 年级内按主题过滤；不足则放宽为全年级词
  var pool = gradeWords().filter(function(w){
    return !topics || topics.indexOf(w.topic) >= 0;
  });
  if(pool.length < n) pool = gradeWords();
  // 2) 错词本优先（最多占 60%）
  var wrongIn = pool.filter(function(w){ return S.save.wrong[w.en]; });
  var out = [];
  shuffle(wrongIn).slice(0, Math.ceil(n*0.6)).forEach(function(w){ out.push(w); });
  var rest = shuffle(pool).filter(function(w){
    return !out.some(function(o){ return o.en===w.en; });
  });
  for(var i=0; out.length<n && i<rest.length; i++){ out.push(rest[i]); }
  // 3) 兜底：仍不足则允许跨档补充（同样过滤未解锁培优/拔高）
  if(out.length < n){
    shuffle(WORDS).forEach(function(w){
      if(out.length<n && wordUnlocked(w) && !out.some(function(o){ return o.en===w.en; })) out.push(w);
    });
  }
  return shuffle(out).slice(0, n);
}
/* 干扰项：优先同主题同年级 → 同年级 → 全库（按 key 去重） */
function distractors(word, n, keyOf){
  var same = gradeWords().filter(function(w){
    return w.en!==word.en && w.topic===word.topic && keyOf(w)!==keyOf(word);
  });
  var near = gradeWords().filter(function(w){
    return w.en!==word.en && keyOf(w)!==keyOf(word) && !same.some(function(s){ return s.en===w.en; });
  });
  var far = WORDS.filter(function(w){
    return w.en!==word.en && wordUnlocked(w) && keyOf(w)!==keyOf(word)
      && !same.some(function(s){ return s.en===w.en; })
      && !near.some(function(s){ return s.en===w.en; });
  });
  var out = [];
  [same, near, far].forEach(function(group){
    shuffle(group).forEach(function(w){
      if(out.length<n && !out.some(function(o){ return o.en===w.en; })) out.push(w);
    });
  });
  return out.slice(0, n);
}
/* 模块1：单词消消乐（看词选图 / 看图选词，4 选 1） */
function makeMatch(word){
  var e2p = Math.random() < 0.5;
  var ds = distractors(word, 3, function(w){ return w.en; });
  var opts = shuffle([word].concat(ds));
  return { type:"match", dir: e2p?"e2p":"p2e", word:word,
    opts: opts, ans: opts.indexOf(word) };
}
/* 模块3：听力小侦探（TTS 播报单词或短句，4 图选项）
   严谨性规则（v0.37）：
   - 例句与传入词严格绑定：仅当本词有专属例句时播句子，否则播单词——播报内容 100% 来自本关词池，杜绝"听到的和选项对不上"
   - g3/g4 模板句 "I can see a X." 只用于可数名词主题，避免 "I can see a sunny" 病句
   - 选项必含答案词本体，干扰项与其同年级 */
var NOUN_TOPICS = ["动物","食物","学校","家庭","物品","交通","职业","身体","家居"];
function makeListen(word){
  var bank = LISTEN_SENTENCES[S.save.grade] || [];
  var own = null;
  for(var i=0;i<bank.length;i++){ if(bank[i].en===word.en){ own = bank[i].s; break; } }
  var sentence = word.en;
  if(own){ sentence = own; }
  else if((S.save.grade==="g3"||S.save.grade==="g4") && NOUN_TOPICS.indexOf(word.topic)>=0){
    sentence = "I can see a " + word.en + ".";
  }
  var ds = distractors(word, 3, function(w){ return w.en; });
  var opts = shuffle([word].concat(ds));
  return { type:"listen", word:word, sentence:sentence,
    opts: opts, ans: opts.indexOf(word) };
}
/* 模块2：默写工坊（低/中年级字母块，高年级/初中键盘） */
function makeDict(word){
  return { type:"dict", word:word };
}
/* 模块4：语法小课堂 */
function makeGrammar(usedQs){
  var bank = GRAMMAR[S.save.grade] || GRAMMAR.g1;
  var used = usedQs || (P ? P.usedGrammar : []);
  var avail = bank.filter(function(q){ return used.indexOf(q) < 0; });
  if(!avail.length){ usedQs.length = 0; avail = bank.slice(); }

/* 模块5：单词补全（模板引擎驱动：显示 ap_le 缺字母，4 个字母选项填空）
   g1 缺 1 字母（优先挖元音）；g2 缺 1 字母；g3/g4 缺 2 字母 */
var VOWELS = ["a","e","i","o","u"];
function makePuzzle(word){
  var g = S.save.grade;
  var n = (g==="g1"||g==="g2") ? 1 : 2;
  var en = word.en;
  if(en.length <= n+1) n = 1; // 短词只挖 1 格
  // 选缺失位置：g1/g2 优先元音位置
  var idxs = [];
  for(var i=0;i<en.length;i++) idxs.push(i);
  var pos = [];
  if(g==="g1"||g==="g2"){
    var vow = idxs.filter(function(i){ return VOWELS.indexOf(en[i])>=0; });
    shuffle(vow);
    if(vow.length) pos.push(vow[0]);
  }
  shuffle(idxs);
  for(var j=0; j<idxs.length && pos.length<n; j++){
    if(pos.indexOf(idxs[j])<0) pos.push(idxs[j]);
  }
  pos.sort(function(a,b){ return a-b; });
  var need = pos.map(function(i){ return en[i]; });
  // 4 个字母选项：所需字母 + 干扰字母（去重）
  var opts = need.slice();
  var A2Z = "abcdefghjklmnpqrstvwxyz";
  shuffle(A2Z.split("")).forEach(function(c){
    if(opts.length<4 && opts.indexOf(c)<0 && need.indexOf(c)<0) opts.push(c);
  });
  opts = shuffle(opts);
  return { type:"puzzle", word:word, blankPos:pos, need:need, opts:opts };
}

}

function makeSentence(usedQs){

/* 按 en 查词条（阅读配图用） */
function wordByEn(en){

/* 双音色对话播报：A 行主音色，B 行 pitch 0.9 区分角色（设计文档 9.1）
   v2.20：全部对话行命中预合成清单 → 本地 MP3 顺序链播（真人级、离线可用），仅部分命中或未命中才落原双音色路径 */
function speakLines(lines){
  if(TTS_SET.size && typeof Audio !== "undefined"){
    var txts = [], allHit = true;
    lines.forEach(function(ln){
      var t = String(ln).replace(/^[AB]:\s*/, "");
      txts.push(t);
      if(!TTS_SET.has(ttsSlug(t))) allHit = false;
    });
    if(allHit){
      try{ if(CAP_TTS && CAP_TTS.stop) CAP_TTS.stop(); }catch(e){}
      try{ if(WEB_TTS) speechSynthesis.cancel(); }catch(e){}
      if(_preAudio){ try{ _preAudio.pause(); }catch(e){} }
      var q = txts.slice();
      var playNext = function(){
        if(!q.length){ return; }
        _preAudio = new Audio("assets/tts/" + ttsSlug(q.shift()) + ".mp3");
        var step = function(){ setTimeout(playNext, 250); }; // 句间 250ms 停顿
        if(_preAudio.addEventListener) _preAudio.addEventListener("ended", step);
        var pr = _preAudio.play();
        if(pr && typeof pr.catch === "function") pr.catch(step); // 单句播放异常跳下一句
      };
      try{ playNext(); }catch(e){}
      return true;
    }
  }
  var r = ttsRate();
  if(CAP_TTS){
    try{
      // 原生路径：speak 返回 Promise 在该句播完时 resolve → 顺序链播；
      // A 行 pitch 1.05 / B 行 0.9 区分角色（与网页版双音色一致）
      var st = CAP_TTS.stop(); // 开播前 stop，防止上次对话残留
      if(st && typeof st.catch === "function") st.catch(function(){});
      var chain = Promise.resolve();
      lines.forEach(function(ln, i){
        var txt = ln.replace(/^[AB]:\s*/, "");
        var pitch = (i % 2 === 0) ? 1.05 : 0.9;
        chain = chain.then(function(){
          return CAP_TTS.speak({ text: txt, lang: "en-US", rate: r, pitch: pitch });
        });
      });
      chain.catch(function(){}); // 原生失败静默（已有 Web 兜底逻辑于 speak 单句路径）
      return true;
    }catch(e){}
  }
  if(!ttsOK) return false;
  try{
    speechSynthesis.cancel();
    lines.forEach(function(ln, i){
      var txt = ln.replace(/^[AB]:\s*/, "");
      var u = new SpeechSynthesisUtterance(txt);
      u.lang = "en-US"; u.rate = r;
      u.pitch = (i % 2 === 0) ? 1.05 : 0.9;
      if(enVoice) u.voice = enVoice;
      speechSynthesis.speak(u);
    });
    return true;
  }catch(e){ return false; }
}

function show(name, keepScrollY, anim){
  CUR = name;

  if(anim && app.querySelector){ try{ oldScr = app.querySelector(".screen:not(.screen-under)"); }catch(e){ oldScr = null; } } /* v2.17：排除已垫底旧屏，连续导航时抓到的才是真当前屏 */
  app.innerHTML = '<div class="screen active" id="scr-' + name + '"></div>';

    $("scr-" + name).insertAdjacentHTML("beforeend", tabbarHtml(name));
    document.body.classList.add("tabbed");
    if(TABS.indexOf(CUR_TAB) < 0) CUR_TAB = name;
  }else{
    document.body.classList.remove("tabbed");
  }
  /* v2.13 转场：push=旧屏垫底新屏右滑入；pop=新屏就位旧屏右滑出；fade=内容淡入（180/120ms，transform 合成） */
  if(anim && oldScr && oldScr.id !== ("scr-" + name)){

    }else if(anim === "pop"){

      app.insertBefore(oldScr, app.firstChild);
      setTimeout(function(){ if(oldScr.parentNode) oldScr.parentNode.removeChild(oldScr); }, 200);
    }
  }else if(anim === "fade"){
    $("scr-" + name).classList.add("anim-fade");
  }
  mountPetArts();
  mountWordArts();
  if(typeof keepScrollY === "number"){ window.scrollTo(0, keepScrollY); } // v2.2：Tab 滚动恢复
  else{ window.scrollTo(0,0); }
}

  $("scr-dex").innerHTML = html;

/* ---------- 屏5：关卡地图（12 单元岛 × 5 关，1 星推进，集星开新岛） ---------- */
function levelUnlocked(i, l){
  if(i===0 && l===0) return true;
  var pi = l>0 ? i : i-1, pl = l>0 ? l-1 : LEVELS_PER_ISLAND-1;
  return (S.save.stars[pi+"-"+pl]||0) >= 1;
}
function islandUnlocked(i){
  if(i===0) return true;
  var total = 0;
  for(var l=0;l<LEVELS_PER_ISLAND;l++) total += (S.save.stars[(i-1)+"-"+l]||0);
  return total >= ISLAND_STAR_GOAL;
}
function islandStars(i){
  var t = 0;
  for(var l=0;l<LEVELS_PER_ISLAND;l++) t += (S.save.stars[i+"-"+l]||0);
  return t;
}

/* ==================================================================
 * v2.1 宝可梦图鉴（收服点亮式）：数据来自 assets/dex_data.js
 * window.DEX_TYPES：18 属性 {en,color}；window.DEX_LIST：1025 只档案
 * 新增存档字段：caught（收服 id 数组）/ dexStages（各只独立阶段），migrateSave 兜底
 * ================================================================== */
function dexById(id){ return (window.DEX_LIST || []).filter(function(d){ return d.id === id; })[0] || null; }
function isCaught(id){
  /* v2.3 收服判定按链点亮：caught 存初始形态 id，链内任意形态条目随之点亮 */
  var d = dexById(id);
  var base = (d && d.chain && d.chain.length) ? d.chain[0] : id;
  return (S.save.caught || []).indexOf(base) >= 0;
}
/* v2.3 现役伙伴的图鉴链信息：{baseId, stage, isStarter}；无则 null */
function activeChainInfo(){
  var sv = S.save;
  if(sv.activeDex && dexById(sv.activeDex)) return { baseId: sv.activeDex, stage: sv.stage, isStarter: false };
  var sid = STARTER_DEX[sv.pet];
  return sid ? { baseId: sid, stage: sv.stage, isStarter: true } : null;
}
function dexNo(id){ return ("0000" + id).slice(-4); }
/* ===== v2.3 统一点数经济（数值集中此处，先上线后调只改这一个对象） ===== */
/* v2.4 星星积分单货币；v2.11 进化免费化（进化花费字段删除，唯一门槛=好感满 100）
   starValue：岛 1-3 / 4-6 / 7-9 / 10-12 每颗星积分；catchCost 收服一只 */
var POINTS_CFG = { starValue:[8,12,16,20], catchCost:30, dailyCheckin:30, streak3Bonus:20, streak7Bonus:50,
  affDailyFeed:3, affDailyTrain:3, affCost:1, affPerAction:1, affMax:100, evoAffNeed:100 }; /* v2.8 好感养成（节奏：每天 6 次 × 1 好感 → 首次进化约 17 天养成期，数值集中此处可调） */
var STARTER_DEX = { starter1:1, starter2:4, starter3:7 }; // 御三家 → 图鉴初始形态 id
function addPoints(n){
  S.save.coins = Math.max(0, (S.save.coins||0) + n);
  if(n > 0) S.save.coinsEarned = (S.save.coinsEarned||0) + n; // v2.7 累计获得总额（只记收入）
}
/* v2.7 消费流水：所有积分支出逐笔记录（最近 200 条封顶），「我的-消费记录」展示 */
function addLedger(type, amount, desc){
  var sv = S.save;
  sv.ledger = sv.ledger || [];
  sv.ledger.push({ ts:Date.now(), type:type, amount:amount, after:sv.coins||0, desc:desc });
  if(sv.ledger.length > 200) sv.ledger = sv.ledger.slice(-200);
}
/* 现役伙伴的图鉴基础形态 id（activeDex / 御三家映射） */
function activeBaseId(){
  var sv = S.save;
  if(sv.activeDex && dexById(sv.activeDex)) return sv.activeDex;
  return STARTER_DEX[sv.pet] || null;
}
/* 现役伙伴当前阶段（dexStages 派生） */
function curStage(){
  var b = activeBaseId();
  return b ? (S.save.dexStages[b] || 1) : (S.save.stage || 1);
}
/* v2.4 现役伙伴进化：花积分升阶（1→2 阶 40、2→3 阶 60），永不回退 */
/* v2.8 好感养成：喂养/训练，各每日 3 次，每次 1 积分 +1 好感（封顶 affMax），流水记账 */
function affAction(kind){
  var base = activeBaseId();
  if(!base){ toast("先领养伙伴再来培养好感吧～"); return; }
  var daily = S.save.daily.t = S.save.daily.t || {};
  var key = kind === "feed" ? "fedN" : "trainN";
  var limit = kind === "feed" ? POINTS_CFG.affDailyFeed : POINTS_CFG.affDailyTrain;
  var actName = kind === "feed" ? "喂养" : "训练";
  if((daily[key]||0) >= limit){ toast("今天" + actName + "次数用完啦（每天 " + limit + " 次），明天再来～"); return; }
  if((S.save.coins||0) < POINTS_CFG.affCost){ toast("积分不够啦（还差 " + (POINTS_CFG.affCost - (S.save.coins||0)) + " 分）～"); return; }
  daily[key] = (daily[key]||0) + 1;
  addPoints(-POINTS_CFG.affCost);
  S.save.dexAff = S.save.dexAff || {};
  var after = Math.min(POINTS_CFG.affMax, (S.save.dexAff[base]||0) + POINTS_CFG.affPerAction);
  S.save.dexAff[base] = after;
  var nm = (dexById(base)||{}).name || "伙伴";
  addLedger(kind, -POINTS_CFG.affCost, actName + " " + nm);
  saveGame();
  sfx("ok");
  show("pet");
  toast((kind === "feed" ? "🍖 喂养成功！" : "🎯 训练成功！") + " 好感 " + after + "/" + POINTS_CFG.affMax + (after >= POINTS_CFG.affMax ? "（好感满满）" : ""));
}
function feedPet(){ affAction("feed"); }
function trainPet(){ affAction("train"); }
function evolvePet(){
  var base = activeBaseId();
  var d = base ? dexById(base) : null;
  if(!d || !d.chain || d.chain.length < 2){ toast("这只伙伴没有进化形态哦～"); return; }
  var st = S.save.dexStages[base] || 1;
  if(st >= d.chain.length){ toast("已达最终形态！"); return; }
  /* v2.11 进化唯一条件：好感 ≥ evoAffNeed（免费进化，不再扣积分/记流水） */
  var aff = (S.save.dexAff||{})[base]||0;
  if(aff < POINTS_CFG.evoAffNeed){ toast("好感还不够哦～还差 " + (POINTS_CFG.evoAffNeed - aff) + "，喂养/训练伙伴攒好感吧"); return; }
  var evoTo = st + 1;
  if(AUTO_CONFIRM){ doEvolvePet(base, st, evoTo); return; }
  confirmDialog("伙伴进化", "让" + d.name + "进化到 " + evoTo + " 阶？", "🧬 进化", "再想想").then(function(okk){
    if(okk) doEvolvePet(base, st, evoTo);
  });
}
function doEvolvePet(base, st, evoTo){
  var before = st;
  S.save.dexStages[base] = evoTo;
  S.save.stage = evoTo; // 镜像同步
  saveGame();
  sfx("ach");
  show("pet");
  setTimeout(function(){ celebration(before, evoTo); }, 600);
}
/* v2.4 主动收服：图鉴详情页花积分收服指定宝可梦（chain[0] 入库，独立 1 阶起步） */
function catchDex(id){
  var d = dexById(id);
  if(!d) return;
  var base = (d.chain && d.chain.length) ? d.chain[0] : id;
  if(isCaught(base)){ toast("已经收服过啦～"); return; }
  if((S.save.coins||0) < POINTS_CFG.catchCost){ toast("积分不够啦（还差 " + (POINTS_CFG.catchCost - (S.save.coins||0)) + " 分），过关攒积分吧～"); return; }
  if(AUTO_CONFIRM){ doCatchDex(id, base, d); return; }
  confirmDialog("收服伙伴", "用 " + POINTS_CFG.catchCost + " 积分收服 " + d.name + "？", "🎯 收服", "再想想").then(function(okk){
    if(okk) doCatchDex(id, base, d);
  });
}
function doCatchDex(id, base, d){
  addPoints(-POINTS_CFG.catchCost);
  addLedger("catch", -POINTS_CFG.catchCost, "收服 " + d.name); // v2.7 流水
  S.save.caught.push(base);
  S.save.dexStages[base] = 1;
  saveGame();
  sfx("ach");
  toast("🎉 收服成功！「" + d.name + "」加入图鉴！");
  openDex(id);
}
/* 过关打卡：每日首次过关=打卡成功；连签按自然日差计算，断签重计 */
function levelCheckin(){
  var today = todayStr();
  if(S.save.lastCheckin === today) return { checked:false, gain:0, tag:"今日已打卡" };
  var y = new Date(); y.setDate(y.getDate()-1);
  var yest = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  S.save.streak = (S.save.lastCheckin === yest) ? (S.save.streak||0)+1 : 1; // 断签重计
  S.save.lastCheckin = today;
  var gain = POINTS_CFG.dailyCheckin;
  var tag = "打卡成功 · 连签 " + S.save.streak + " 天";
  if(S.save.streak === 3){ gain += POINTS_CFG.streak3Bonus; tag += " 🎁+" + POINTS_CFG.streak3Bonus; }
  else if(S.save.streak >= 7){ gain += POINTS_CFG.streak7Bonus; tag += " 🎁+" + POINTS_CFG.streak7Bonus; }
  addPoints(gain);
  return { checked:true, gain:gain, tag:tag };
}
/* v2.4 兼容：保留 levelCheckin 结算文案单位为积分 */
/* 图鉴形象大图（详情页）：与列表同一圆形容器样式，仅尺寸放大 */
/* v2.6：webp 加载失败兜底 → 属性色占位 SVG（1025 张全量真图，正常路径不再有占位分支） */
function dexArtFail(img){
  var p = img.parentNode;
  if(!p || p.getAttribute("data-fb")) return;
  p.setAttribute("data-fb", "1");
  var c = img.getAttribute("data-color") || "#b0a08c";
  var n = (img.getAttribute("alt") || "?").charAt(0);
  p.innerHTML = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">'
    + '<circle cx="50" cy="50" r="50" fill="' + c + '"/>'
    + '<text x="50" y="62" text-anchor="middle" font-size="30" fill="#fff" stroke="none" font-weight="bold" font-family="Georgia,serif">' + n + '</text></svg>';
}
function dexArtImgBig(d, lit){
  var c2 = (window.DEX_TYPES || {})[d.types[0]] || {color:"#b0a08c"};
  var inner = '<img src="assets/pokedex/' + dexNo(d.id) + '.webp" alt="' + d.name + '" data-color="' + c2.color + '" onerror="dexArtFail(this)">';
  return '<div class="dex-img big' + (lit ? "" : " uncaught") + '">' + inner + '</div>';
}
/* 图鉴形象：全量 webp 真图；未收服剪影（v2.6 起 152+ 同样走真图） */
function dexArtImg(d, lit){
  var c = (window.DEX_TYPES || {})[d.types[0]] || {color:"#b0a08c"};
  var inner = '<img src="assets/pokedex/' + dexNo(d.id) + '.webp" alt="' + d.name + '" data-color="' + c.color + '" onerror="dexArtFail(this)">';
  return '<div class="dex-img' + (lit ? "" : " uncaught") + '">' + inner + '</div>';
}
/* ---------- v2.2 图鉴页（双名 + 分批渲染：每批 60 只，滚动到底自动加载） ---------- */
var DEX_FILTER = { mode: "all" }; // all | caught | type:<zh>
var DEX_BATCH = 60, DEX_SHOWN = 0;
function dexSetFilter(mode){ DEX_FILTER.mode = mode; show("dexlist"); }
/* v2.5 图鉴按进化链归并：以 chain[0] 为键分组（~345 链 + 207 独立），按初始形态 id 升序 */
var _dexChains = null;
function dexChainList(){
  if(_dexChains) return _dexChains;
  var seen = {}, out = [];
  (window.DEX_LIST||[]).forEach(function(d){
    var b = (d.chain && d.chain.length) ? d.chain[0] : d.id;
    if(!seen[b]){ seen[b] = true; var base = dexById(b); if(base) out.push(base); }
  });
  out.sort(function(a,b){ return a.id - b.id; });
  _dexChains = out;
  return out;
}
/* 条目的当前显示形态：未收服=初始形态；已收服=dexStages 对应阶段（独立宝可梦恒为自身） */
function chainDisplayDex(base){
  var lit = isCaught(base.id);
  var st = lit ? ((S.save.dexStages||{})[base.id] || 1) : 1;
  if(lit && base.chain && base.chain.length > 1 && st > 1){
    return dexById(base.chain[Math.min(st, base.chain.length) - 1]) || base;
  }
  return base;
}
function dexFiltered(){
  /* v2.5：筛选只留 全部 + 18 属性；属性匹配按条目当前显示形态（用户看到什么筛什么）
     v2.7 排序：现役伙伴所在链恒第一 → 已收服链按收服时间倒序（caught 数组序=收服序）→ 未收服按 base id 升序 */
  var ac = activeChainInfo();
  var caught = S.save.caught || [];
  var list = dexChainList().filter(function(base){
    if(DEX_FILTER.mode.indexOf("type:")===0){
      var cur = chainDisplayDex(base);
      if(cur.types.indexOf(DEX_FILTER.mode.slice(5))<0) return false;
    }
    return true;
  });
  list.sort(function(a,b){
    var ta = (ac && a.id===ac.baseId) ? 0 : (caught.indexOf(a.id)>=0 ? 1 : 2);
    var tb = (ac && b.id===ac.baseId) ? 0 : (caught.indexOf(b.id)>=0 ? 1 : 2);
    if(ta !== tb) return ta - tb;
    if(ta === 1) return caught.indexOf(b.id) - caught.indexOf(a.id); // 收服倒序（后收服在前）
    return a.id - b.id; // 现役唯一不重排；未收服 id 升序
  });
  return list;
}
function dexCardHtml(base){
  /* v2.6 链归并条目：全量 1025 webp 真图（SVG 仅 onerror 兜底），图与名字全部跟随当前形态
     未收服 = 灰色初始形态 + 初始形态双名；已收服 = dexStages 当前形态真图 + 名 */
  var lit = isCaught(base.id);
  var cur = chainDisplayDex(base);
  var art = dexArtImg(lit ? cur : base, lit);
  /* v2.5：现役伙伴所在链 → 💖我的伙伴标记 */
  var ac = activeChainInfo();
  var mine = (ac && ac.baseId === base.id) ? '<div class="dex-mine">💖</div>' : "";
  /* 名字跟随当前显示形态 */
  return '<div class="dex-cell' + (lit?" lit":"") + '" onclick="openDex(' + base.id + ')">'
    + art + mine
    + '<div class="dn">' + cur.name + '</div>'
    + '<div class="de">' + (cur.en||base.en||"") + '</div>'
    + '<div class="di">' + dexNo(base.id) + '</div></div>';
}
/* 追加下一批到网格（不重渲染全量，避免 3000+ DOM 重建卡顿） */
function dexLoadMore(){
  var grid = $("dexGrid");
  if(!grid) return false;
  var list = dexFiltered();
  if(DEX_SHOWN >= list.length){ dexMoreState(); return false; }
  var to = Math.min(list.length, DEX_SHOWN + DEX_BATCH);
  var html = "";
  for(var i=DEX_SHOWN; i<to; i++) html += dexCardHtml(list[i]);
  grid.insertAdjacentHTML("beforeend", html);
  DEX_SHOWN = to;
  dexMoreState();
  return true;
}
function dexMoreState(){
  var el = $("dexMore");
  if(el) el.style.display = DEX_SHOWN >= dexFiltered().length ? "none" : "block";
}
function dexResetBatches(){

}
var DEX_VIEW_STAGE = 0; // v2.7 详情页所选链阶段（0=跟随当前收服形态）

/* v2.7 点击进化链节点切换详情到该阶段（名字/图/全字段跟随所选阶段渲染） */

/* 滚动节流：距底部 600px 内自动加载下一批（配合 CSS touch-action/overscroll） */

/* ---------- v2.1 图鉴详情页（档案 + 属性标签发音 + 进化链 + 属性小课堂） ---------- */

/* ---------- 屏6：答题（关卡 / 自由练习共用） ---------- */
var P = null; // 当前对局状态
var PLAY_FROM = "home"; // v2.0：对局来源 Tab（退出/结算后返回；放全局避免结算置空 P 后丢失）
var LEVEL_PLAY_LIMIT = 9; // v2.12 每日每关可玩次数（3→9，用户放宽）
function newPlayState(mode, mod){
  return { mode:mode, module:mod, qi:0, correct:0, combo:0, answered:false,
    usedGrammar:[], usedScene:[], usedSentence:[], usedDaily:[], usedReading:[],
    totalQ: mod==="memory" ? 1 : QS_PER_LEVEL, qs:[] };
}
function startLevel(i, l){
  /* v2.4 关卡可重复玩，每日每关 3 次（plays[levelKey] 挂 daily，跨天自动重置） */
  var playKey = i + "-" + l;
  var plays = S.save.daily.t.plays = S.save.daily.t.plays || {};
  if((plays[playKey]||0) >= LEVEL_PLAY_LIMIT){ toast("今天这关玩满 " + LEVEL_PLAY_LIMIT + " 次啦，明天再来～（每天每关 " + LEVEL_PLAY_LIMIT + " 次）"); return; }
  var T = THEMES[S.theme];
  var plan = LEVEL_PLANS[i] || LEVEL_PLAN;
  var mod = plan[l];
  P = newPlayState("level", mod);
  P.island = i; P.level = l; PLAY_FROM = "map"; // v2.0：退出时返回来源 Tab
  plays[playKey] = (plays[playKey]||0) + 1; // v2.4：计入每日次数
  if(mod !== "memory"){
    var words = pickWords(QS_PER_LEVEL, T.islands[i].topics);
    if(mod==="dict" || mod==="puzzle") words = wordsForSpelling(words); // v2.6：字母块/默写跳过多词短语
    words.forEach(function(w, idx){ P.qs.push(buildQ(mod, w, idx)); });
  }else{
    P.qs.push(makeMemory());
  }
  navEnter("play"); // v2.2：答题页入栈（题目已就绪）
  show("play");
}
function startFree(mod){
  P = newPlayState("free", mod);
  PLAY_FROM = "home"; // v2.0：退出时返回来源 Tab
  if(mod !== "memory"){
    var words = pickWords(QS_PER_LEVEL, null);
    if(mod==="dict" || mod==="puzzle") words = wordsForSpelling(words); // v2.6：字母块/默写跳过多词短语
    words.forEach(function(w){ P.qs.push(buildQ(mod, w)); });
  }else{
    P.qs.push(makeMemory());
  }
  navEnter("play"); // v2.2：答题页入栈（题目已就绪）
  show("play");
}
function buildQ(mod, word, idx){
  if(mod==="match") return makeMatch(word);
  if(mod==="listen") return makeListen(word);
  if(mod==="dict") return makeDict(word);
  if(mod==="grammar") return makeGrammar(P.usedGrammar);
  if(mod==="puzzle") return makePuzzle(word);
  if(mod==="listenScene") return makeScene(P.usedScene);
  if(mod==="sentence") return makeSentence(P.usedSentence);
  if(mod==="daily") return makeDaily(P.usedDaily);
  if(mod==="reading") return makeReading(P.usedReading);
  if(mod==="boss"){ // BOSS 混合复习关：第4题固定语法，第5题从新模块池随机，其余词汇模块
    var order = ["match","listen","dict","grammar", pick(BOSS_POOL)];
    return buildQ(order[idx] || pick(BOSS_POOL), word, idx);
  }
  return null;
}

        : '<div class="degrade">🐶 本设备暂不支持语音朗读，直接阅读对话作答</div>');
