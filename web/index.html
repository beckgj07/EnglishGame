/* ---- 单词补全 ---- */
function renderPzWord(){
  var q = P.qs[P.qi];
  var html = "";
  var filledCount = 0;
  for(var i=0;i<q.word.en.length;i++){
    var bi = q.blankPos.indexOf(i);
    if(bi < 0){ html += q.word.en[i]; }
    else{
      var ch = P.pz.filled[bi];
      if(ch){ html += '<span class="pz-blank filled">' + ch + '</span>'; filledCount++; }
      else html += '<span class="pz-blank' + (bi===filledCount?" cur":"") + '">' + q.word.en[i] + '</span>';
    }
  }
  var el = $("pzWord"); if(el) el.innerHTML = html;
}
function answerPuzzle(i){
  if(P.answered) return;
  var q = P.qs[P.qi];
  var bi = P.pz.filled.indexOf(null);
  if(bi < 0) return;
  var letter = q.opts[i];
  if(letter === q.need[bi]){
    P.pz.filled[bi] = letter;
    speak(letter);
    if(P.pz.filled.indexOf(null) < 0){
      P.answered = true;
      afterAnswer(true, q.word.en, q);
    }else{
      renderPzWord();
    }
  }else{
    P.answered = true;
    afterAnswer(false, q.word.en, q);
  }
}
function pzHint(){
  var q = P.qs[P.qi];
  var el = $("pzZh");
  if(el) el.innerHTML = "💡 " + q.word.zh;
  petSay("这个单词是「" + q.word.zh + "」哦！");
}
/* ---- 卡牌翻翻乐 ---- */
function renderMemCards(){
  var q = P.qs[P.qi];
  var g = $("memGrid");
  if(!g) return;
  g.innerHTML = q.cards.map(function(c, i){
    var isOpen = P.mem.open.indexOf(i) >= 0 || P.mem.matched[i];
    var label = isOpen ? (c.t==="en" ? c.w.en : '<span>' + c.w.zh + '</span><span class="mzh">词</span>')
      : "?";
    var zh2 = isOpen && c.t==="zh" ? '<span class="mzh">' + c.w.en + '</span>' : "";
    return '<div class="mcard' + (isOpen?"":" back") + (P.mem.matched[i]?" done":"") + '" onclick="memoryFlip(' + i + ')">'
      + (isOpen ? (c.t==="en" ? c.w.en : c.w.zh + zh2) : "❓") + '</div>';
  }).join("");
  var info = $("memInfo");
  var pairs = Object.keys(P.mem.matched).length / 2;
  if(info) info.innerHTML = "已翻 " + P.mem.steps + " 步 · 配对 " + pairs + "/4";
}
function memoryFlip(i){
  if(P.answered || P.mem.lock || P.mem.matched[i] || P.mem.open.indexOf(i)>=0) return;
  P.mem.open.push(i);
  if(P.mem.open.length === 2){
    P.mem.steps++;
    var q = P.qs[P.qi];
    var a = P.mem.open[0], b = P.mem.open[1];
    var ca = q.cards[a], cb = q.cards[b];
    if(ca.w.en === cb.w.en && ca.t !== cb.t){ // 配对成功
      P.mem.matched[a] = true; P.mem.matched[b] = true;
      P.mem.open = [];
      speak(ca.w.en);
      S.save.stats.correct++;
      S.save.stats.maxCombo = Math.max(S.save.stats.maxCombo||0, P.combo);
      bumpTask("t1", (S.save.daily.t.t1||0)+1);
      saveGame();
      renderMemCards();
      var pairs = Object.keys(P.mem.matched).length / 2;
      if(pairs >= 4){ // 全部配对 → 结算（按步数评星：≤10=3星、≤14=2星、其余1星）
        P.memStars = P.mem.steps<=10 ? 3 : (P.mem.steps<=14 ? 2 : 1);
        P.memSteps = P.mem.steps;
        P.correct = P.memStars===3 ? 5 : (P.memStars===2 ? 4 : 3);
        P.answered = true;
        petSay("全部配对成功！用了 " + P.mem.steps + " 步！");
        setTimeout(finishPlay, 900);
      }else{
        petSay(pick(CHEERS));
      }
    }else{ // 配对失败：翻回（同一词配错 2 次入错词本）
      P.mem.lock = true;
      P.mem.miss[ca.w.en] = (P.mem.miss[ca.w.en]||0)+1;
      P.mem.miss[cb.w.en] = (P.mem.miss[cb.w.en]||0)+1;
      [ca.w.en, cb.w.en].forEach(function(en){
        if(P.mem.miss[en] >= 4) S.save.wrong[en] = (S.save.wrong[en]||0)+1; // 每词两侧各计数，≥4 即配错 2 次
      });
      saveGame();
      renderMemCards();
      setTimeout(function(){
        P.mem.open = []; P.mem.lock = false;
        renderMemCards();
      }, 750);
    }
  }else{
    renderMemCards();
  }
}
/* ---- 句子排排队 ---- */
function renderSentenceBlocks(){
  var q = P.qs[P.qi];
  var built = $("sentBuilt"), pool = $("sentPool");
  if(!built || !pool) return;
  built.innerHTML = P.sent.built.length ? P.sent.built.map(function(w, i){
    return '<span class="sword" onclick="sentUnpick(' + i + ')">' + w + '</span>';
  }).join("") : '<span style="color:#b3a48c;font-size:.95rem">（把词块点到这里）</span>';
  pool.innerHTML = q.words.map(function(w, i){
    var usedCnt = P.sent.built.filter(function(x){ return x===w; }).length;
    var shownCnt = q.words.slice(0, i+1).filter(function(x){ return x===w; }).length;
    return '<span class="sword' + (shownCnt<=usedCnt?" used":"") + '" onclick="sentPick(' + i + ')">' + w + '</span>';
  }).join(" ");
}
function sentPick(i){
  if(P.answered) return;
  var q = P.qs[P.qi];
  if(P.sent.built.length >= q.correct.length) return;
  P.sent.built.push(q.words[i]);
  renderSentenceBlocks();
  if(P.sent.built.length === q.correct.length){
    var ok = P.sent.built.join(" ") === q.correct.join(" ");
    setTimeout(function(){
      P.answered = true;
      if(ok) speak(q.item.s);
      afterAnswer(ok, q.kw, q);
    }, 250);
  }
}
function sentUnpick(i){
  if(P.answered) return;
  P.sent.built.splice(i,1);
  renderSentenceBlocks();
}
function sentReset(){
  if(P.answered) return;
  P.sent.built = [];
  renderSentenceBlocks();
}
/* ---- 情景听力：重听（最多 3 次） ---- */
function sceneReplay(){
  if(P.answered) return;
  if(P.sceneReplays >= 3){ toast("每题最多重听 3 次哦，仔细听～"); return; }
  P.sceneReplays++;
  var q = P.qs[P.qi];
  speakLines(q.item.d);
}
/* ---- 阅读理解：生词点读（发音 + 自动进错词本） ---- */
function readingTap(w){
  speak(w);
  if(!S.save.wrong[w]) toast("📖 「" + w + "」已收进错词本，之后会重点复习！");
  S.save.wrong[w] = (S.save.wrong[w]||0) + 1;
  saveGame();
}
/* 听力/默写/情景对话发音 */
function speakQ(){
  var q = P && P.qs ? P.qs[P.qi] : null;
  if(!q) return;
  if(q.type==="listen") speak(q.sentence);
  else if(q.type==="dict") speak(q.word.en);
  else if(q.type==="listenScene") speakLines(q.item.d);
}
/* 听力降级模式下 peek */
/* 选择题作答（消消乐 / 听力 / 语法共用） */
function answerMC(i){
  if(P.answered) return;
  P.answered = true;
  var q = P.qs[P.qi];
  var right = (i === q.ans);
  var opts = document.querySelectorAll("#qarea .opt");
  for(var k=0;k<opts.length;k++){
    if(k===q.ans) opts[k].classList.add("right");
    else if(k===i && !right) opts[k].classList.add("wrong");
    opts[k].style.pointerEvents = "none";
  }
  var wordEn = null; // 进错词本的词：词汇题=本词；剧场/情景=关键应答词；阅读=短文关键词；排句=句关键词
  if(q.type==="grammar"){ wordEn = null; }
  else if(q.word && q.word.en){ wordEn = q.word.en; }
  else if(q.item && q.item.kw){ wordEn = q.item.kw; }
  else if(q.kw){ wordEn = q.kw; }
  else if(q.passage && q.passage.kw){ wordEn = q.passage.kw; }
  afterAnswer(right, wordEn, q);
}
/* 默写：字母块 */
function renderTiles(){
  var q = P.qs[P.qi];
  var tz = $("typedZone"), pz = $("poolZone");
  var tHtml = "";
  for(var i=0;i<q.word.en.length;i++){
    var ch = P.tile.typed[i];
    tHtml += ch
      ? '<div class="tile" onclick="unType(' + i + ')">' + ch + '</div>'
      : '<div class="tile ghost">&nbsp;</div>';
  }
  tz.innerHTML = tHtml;
  var pHtml = "";
  P.tile.pool.forEach(function(ch, idx){
    var usedCount = P.tile.typed.filter(function(c){ return c===ch; }).length;
    var poolShown = P.tile.pool.slice(0, idx+1).filter(function(c){ return c===ch; }).length;
    pHtml += '<div class="tile' + (poolShown<=usedCount?" used":"") + '" onclick="typeLetter(' + idx + ')">' + ch + '</div>';
  });
  pz.innerHTML = pHtml;
}
function typeLetter(idx){
  if(P.answered) return;
  var q = P.qs[P.qi];
  if(P.tile.typed.length >= q.word.en.length) return;
  P.tile.typed.push(P.tile.pool[idx]);
  renderTiles();
  if(P.tile.typed.length === q.word.en.length){
    var typed = P.tile.typed.join("");
    setTimeout(function(){
      P.answered = true;
      afterAnswer(typed === q.word.en, q.word.en, q);
    }, 250);
  }
}
function unType(i){
  if(P.answered) return;
  P.tile.typed.splice(i,1);
  renderTiles();
}
function dictHint(){
  if(P.answered) return;
  var q = P.qs[P.qi];
  if(q.type==="dict" && P.tile){
    if(P.tile.typed.length===0 && P.tile.pool.indexOf(q.word.en[0])>=0){
      var idx = P.tile.pool.indexOf(q.word.en[0]);
      P.tile.typed.push(q.word.en[0]);
      P.tile.pool.splice(idx,1);
      renderTiles();
      petSay("首字母是 " + q.word.en[0].toUpperCase() + " 哦！");
    }
  }else{
    var di = $("dictInput");
    if(di && !di.value){ di.value = q.word.en[0]; di.focus(); }
    petSay("首字母是 " + q.word.en[0].toUpperCase() + " 哦！");
  }
}
function dictCheckKey(){
  if(P.answered) return;
  var q = P.qs[P.qi];
  var di = $("dictInput");
  var v = (di.value||"").trim().toLowerCase();
  if(!v) return;
  P.answered = true;
  afterAnswer(v === q.word.en, q.word.en, q);
}
/* 统一答后处理：能量 / 连击 / 错词本 / 每日任务 / 反馈 */
function afterAnswer(right, wordEn, q){
  var fb = $("fb");
  var extra = "";
  S.save.stats.totalAns = (S.save.stats.totalAns||0) + 1; // v0.8 成就埋点：累计答题
  /* v2.0 学习坚持天数埋点：按日记录答题次数（旧存档无此字段，读取时安全兜底） */
  S.save.activity = S.save.activity || {};
  var _actKey = todayStr();
  /* v2.7 按日按模块聚合：activity[date]={total,listen,match,...}（旧数字档迁移见 migrateSave） */
  if(!S.save.activity[_actKey] || typeof S.save.activity[_actKey] !== "object") S.save.activity[_actKey] = { total:0 };
  S.save.activity[_actKey].total = (S.save.activity[_actKey].total||0) + 1;
  if(P && P.module) S.save.activity[_actKey][P.module] = (S.save.activity[_actKey][P.module]||0) + 1;
  if(right){
    P.combo++;
    P.correct++;
    S.save.stats.correct++;
    sfx("ok"); // v1.0 答对音效
    // v0.8 培优/拔高答对埋点与提示（星星加成在结算时生效）
    var lvTag = "";
    if(q.word && q.word.level==="培优"){
      P.advN = (P.advN||0) + 1;
      S.save.stats.advOK = (S.save.stats.advOK||0) + 1;
      lvTag = " 🌟培优词 +1.5★！";
    }else if(q.word && q.word.level==="拔高"){
      P.chalN = (P.chalN||0) + 1;
      S.save.stats.chalOK = (S.save.stats.chalOK||0) + 1;
      lvTag = " 🚀拔高词 +2★！";
    }
    bumpTask("t1", (S.save.daily.t.t1||0)+1);
    if(q.type==="dict"){
      S.save.stats.dictOK++;
      bumpTask("t2", (S.save.daily.t.t2||0)+1);
    }
    // v0.8 成就埋点：听力类答对计数
    if(q.type==="listen" || q.type==="listenScene"){
      S.save.stats.listenOK = (S.save.stats.listenOK||0) + 1;
    }
    // v0.8 成就埋点：阅读——同篇 3 题全对即"读完"
    if(q.type==="reading" && right){
      P.readOK = P.readOK || {};
      P.readOK[q.pi] = (P.readOK[q.pi]||0) + 1;
      if(P.readOK[q.pi] >= 3){
        var rk = S.save.grade + ":" + q.pi;
        if(!S.save.readPass[rk]){
          S.save.readPass[rk] = true;
          toast("📚 读完《" + q.passage.title + "》！");
        }
      }
    }
    if(P.combo>=5) bumpTask("t3", Math.max(S.save.daily.t.t3||0, P.combo));
    S.save.stats.maxCombo = Math.max(S.save.stats.maxCombo||0, P.combo);
    if(P.combo===5) toast("🔥 5 连击！太厉害了！");
    petSay(pick(CHEERS));
    var okExtra = "";
    if(q.type==="daily") okExtra = "<br><span style='font-weight:normal;font-size:.95rem'>💬 " + q.item.zh + "</span>";
    if(q.type==="sentence") okExtra = "<br><span style='font-weight:normal;font-size:.95rem'>🔊 " + q.item.s + "</span>";
    if(fb){
      fb.className = "fb ok";
      fb.innerHTML = "🎉 答对啦！" + (P.combo>=3 ? "🔥 连击 ×" + P.combo + "！" : "") + lvTag + okExtra;
    }
  }else{
    P.combo = 0;
    sfx("no"); // v1.0 答错音效（音量低）
    if(wordEn){
      S.save.wrong[wordEn] = (S.save.wrong[wordEn]||0) + 1;
    }
    petSay(pick(SOFT));
    var ansTxt;
    if(q.type==="grammar"){
      ansTxt = "正确答案：" + q.item.opts[q.item.a];
    }else if(q.type==="dict"){
      ansTxt = "正确拼写：<span class='ans'>" + q.word.en + "</span>";
    }else if(q.type==="sentence"){
      ansTxt = "正确语序：<span class='ans'>" + q.item.s + "</span>";
    }else if(q.type==="daily"){
      ansTxt = "正确回应：<span class='ans'>" + q.item.opts[q.item.a] + "</span>"
        + "<br><span style='font-weight:normal;font-size:.95rem'>💬 " + q.item.zh + "</span>";
    }else if(q.type==="listenScene"){
      ansTxt = "正确答案：<span class='ans'>" + q.item.opts[q.item.a] + "</span>";
    }else if(q.type==="reading"){
      ansTxt = "正确答案：<span class='ans'>" + q.question.opts[q.question.a] + "</span>";
    }else{
      ansTxt = "正确答案：<span class='ans'>" + q.word.en + "</span>" + (hasRealArt(q.word) ? " <span style='display:inline-block;width:36px;height:36px;vertical-align:-10px'>" + artHTML(q.word) + "</span>" : "") /* v2.8 */
        + (q.type==="listen" && q.sentence!==q.word.en ? "<br><span style='font-weight:normal;font-size:.9rem'>🔊 原句：" + q.sentence + "</span>" : "");
    }
    var tip = q.type==="grammar" ? "<br><span style='font-weight:normal;font-size:.95rem'>💡 " + q.item.tip + "</span>" : "";
    if(fb){
      fb.className = "fb no";
      fb.innerHTML = "💪 " + pick(SOFT) + "<br>" + ansTxt + tip;
    }
  }
  achieveCheck(); // v0.8 成就达成检测
  saveGame();
  updateProgress();
  P.qi++;
  setTimeout(function(){
    if(P.qi >= QS_PER_LEVEL) finishPlay();
    else renderQuestion();
  }, right ? 1100 : 2300);
}
/* 结算 */
function finishPlay(){
  var stars = 0;
  if(P.mode==="level"){
    if(P.module==="memory" && P.memStars){
      stars = P.memStars;
    }else{
      // v0.8 加权结算：培优题 ×1.5、拔高题 ×2（向上取整由阈值判断承担）
      var eff = P.correct + 0.5*(P.advN||0) + (P.chalN||0);
      stars = eff>=5 ? 3 : (eff>=4 ? 2 : (eff>=3 ? 1 : 0));
    }
    var key = P.island + "-" + P.level;
    var old = S.save.stars[key]||0;
    var newIslandBadge = false;
    if(stars > old){
      S.save.stars[key] = stars;
      // 集齐本岛 5 关各 3 星 → 徽章
      var all3 = true;
      for(var l=0;l<LEVELS_PER_ISLAND;l++){
        if((S.save.stars[P.island+"-"+l]||0) < 3) all3 = false;
      }
      if(all3 && old < 3){ newIslandBadge = true; }
    }
    // v0.8 成就埋点：本次关卡拿到 3 星
    if(stars===3){ S.save.stats.threeStar = (S.save.stats.threeStar||0) + 1; sfx("star3"); }
    // v2.6 星星积分：星数 × 岛屿档位系数（单元岛每 5 座一档 = 8/12/16/20，第 16+ 岛封顶 ×20），培优 ×1.5、拔高 ×2 按渲染星数同步放大
    var tier = Math.min(3, Math.floor(P.island / 5));
    var mult = (P.chalN||0) > 0 ? 2 : (P.advN||0) > 0 ? 1.5 : 1;
    var ptGain = Math.round(stars * POINTS_CFG.starValue[tier] * mult);
    addPoints(ptGain);
    /* v2.7 当日获得积分（累计明细卡展示） */
    S.save.activityGain = S.save.activityGain || {};
    S.save.activityGain[todayStr()] = (S.save.activityGain[todayStr()]||0) + ptGain;
    // 打卡保留：每日首关 +30（连签 3 天 +20 / 7 天起 +50，断签重计）
    var ck = levelCheckin();
    if(ck.checked) ptGain += ck.gain;
    achieveCheck();
    saveGame();
    var T2 = THEMES[S.theme];
    var islTotal = islandStars(P.island);
    var nextIsland = P.island < T2.islands.length-1 && islTotal >= ISLAND_STAR_GOAL;
    var detail = P.module==="memory"
      ? "用 " + P.memSteps + " 步完成全部配对" + (stars>=3 ? "，记性超棒！" : stars>0 ? "，配对成功！再玩一次冲 3 星～" : "")
      : "答对 " + P.correct + "/" + QS_PER_LEVEL + " 题"
      + (stars>=3 ? "，太棒了，完美通关！" : stars>0 ? "，通关啦！再挑战一次冲 3 星～" : "，答错不扣星，再来一次一定行！");
    var res = '<div class="q-card"><div class="q-emoji">' + (stars>=3?"🎉":stars>0?"😊":"🤗") + '</div>'
      + '<div class="q-word" style="font-size:1.4rem">'
      + (stars>0 ? "★".repeat(stars) + "☆".repeat(3-stars) : "本次 0 星") + '</div>'
      + '<p class="q-hint">' + detail + '</p>'
      + (newIslandBadge ? '<p style="font-weight:bold;color:#e07b2f">🏅 获得「' + T2.islands[P.island].name + '」徽章！</p>' : "")
      + '<p style="font-weight:bold;color:#b8860b">✨ 获得 ' + ptGain + ' 积分' + (mult>1 ? "（" + (mult===2?"拔高":"培优") + "加成 ×" + mult + "）" : "") + (ck.checked ? '｜✅ ' + ck.tag : '｜今日已打卡') + '（余额 ' + S.save.coins + '）</p>'
      + '<div style="margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'
      + (stars>=1 && P.level<LEVELS_PER_ISLAND-1 ? '<span class="btn small" onclick="startLevel(' + P.island + ',' + (P.level+1) + ')">下一关 →</span>' : "")
      + (nextIsland
          ? '<span class="btn small green" onclick="startLevel(' + (P.island+1) + ',0)">⛵ 下一座岛 →</span>' : "")
      + '<span class="btn small orange" onclick="startLevel(' + P.island + ',' + P.level + ')">🔄 再玩一次</span>'
      + '<span class="btn small" onclick="quitPlay()">🗺️ 回地图</span></div></div>';
    P = null;
    $("qarea").innerHTML = "";
    var scr = document.querySelector("#scr-play");
    scr.insertAdjacentHTML("beforeend", '<div style="margin-top:8px">' + res + '</div>');
    mountPetArts();
  }else{
    var detail2 = P.module==="memory"
      ? "用 " + P.memSteps + " 步完成全部配对，伙伴超开心～"
      : "答对 " + P.correct + "/" + QS_PER_LEVEL + " 题，伙伴超开心～";
    var res2 = '<div class="q-card"><div class="q-emoji">🌟</div>'
      + '<div class="q-word" style="font-size:1.4rem">练习完成！</div>'
      + '<p class="q-hint">' + detail2 + '</p>'
      + '<div style="margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'
      + '<span class="btn small orange" onclick="startFree(\'' + P.module + '\')">🔄 再来一轮</span>'
      + '<span class="btn small" onclick="quitPlay()">🏠 回主页</span></div></div>';
    P = null;
    $("qarea").innerHTML = "";
    document.querySelector("#scr-play").insertAdjacentHTML("beforeend", '<div style="margin-top:8px">' + res2 + '</div>');
    mountPetArts();
  }
}

/* ==================================================================
 * 能量 & 进化（全屏庆祝动画）
 * ================================================================== */
function celebration(fromStage, toStage){
  var T = THEMES[S.theme];
  var m = petMeta(S.theme, S.save.pet);
  var dx = curDex(); // v2.1：图鉴伙伴进化庆祝（无多阶名，统一用图鉴名）
  var ov = $("overlay");
  var confetti = "";
  var pieces = ["🎊","✨","🌟","🎈","💫","🎉"];
  for(var i=0;i<16;i++){
    confetti += '<span class="confetti" style="left:' + (Math.random()*94+2) + '%;animation-duration:'
      + (2.2 + Math.random()*2) + 's;animation-delay:' + (Math.random()*0.8) + 's">'
      + pick(pieces) + '</span>';
  }
  var fromName = dx ? dx.name : ((m.evo && m.evo[fromStage-1]) || m.name);
  var toName = dx ? dx.name : ((m.evo && m.evo[toStage-1]) || m.name);
  ov.innerHTML = confetti
    + '<div class="aura" style="width:230px">' + petArtAny(toStage) + '</div>'
    + '<div class="cele-title">✨ 进化啦！✨</div>'
    + '<div class="cele-sub"><b style="font-size:1.4rem">' + fromName + '</b> 从「' + T.stages[fromStage-1]
    + '」进化成了「<b style="color:#e07b2f">' + toName + '</b>」（' + T.stages[toStage-1] + '）！<br>'
    + pick(EVOLVE_CHEERS) + '</div>'
    + '<span class="btn big" onclick="closeCele()">太棒了！继续冒险 →</span>';
  ov.classList.add("show");
  sfx("evolve"); // v1.0 进化琶音
  mountPetArts();
}
function closeCele(){
  $("overlay").classList.remove("show");
  $("overlay").innerHTML = "";
  // 答题中触发的进化：只关覆盖层，不打断当前对局；其他屏幕重新渲染（能量条等刷新）
  if(CUR === "play") return;
  show(CUR || "home");
}

/* ==================================================================
 * 每日任务进度（localStorage 按日期重置）
 * ================================================================== */
function bumpTask(id, val){
  var d = S.save.daily;
  if(d.date !== todayStr()){ d.date = todayStr(); d.t = {t1:0,t2:0,t3:0}; d.done = {}; }
  d.t[id] = val;
  var def = TASK_DEF.filter(function(x){ return x.id===id; })[0];
  if(def && !d.done[id] && d.t[id] >= def.goal){
    d.done[id] = true;
    toast("🎉 完成每日任务：" + def.name + "！");
  }
}

/* ==================================================================
 * 启动
 * ================================================================== */
/* v2.2 Android 硬件返回键：页面栈 pop / 答题确认退出 / 主层双击退出（2 秒内） */
var LAST_BACK_TS = 0;
function handleBackButton(){
  // 1) 答题中：确认后放弃（v2.13 统一弹窗，quitPlay 内部处理确认）
  if(CUR==="play" && P){
    quitPlay();
    return;
  }
  // 2) 二级页栈：pop
  if(NAV_STACK.length > 0){ navBack(); return; }
  // 3) v2.5：grade/adopt 为入口屏（主题屏已删），无栈可回 → 落入退出确认分支
  // 4) 二级页但栈空（防御）：回所属 Tab（v2.5：adopt 为入口流，不在此列）
  var home2 = { wrong:"mine", parent:"mine", dex:"pet", dexlist:"pet", dexdetail:"dexlist" }[CUR];
  if(home2){ show(home2); return; }
  // 5) 主层（theme / 四 Tab）：第一次提示，2 秒内再按退出
  var now = Date.now();
  if(now - LAST_BACK_TS < 2000){
    var App2 = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if(App2){ App2.exitApp(); }
  }else{
    LAST_BACK_TS = now;
    toast("再按一次退出应用");
  }
}
/* ==================================================================
 * v2.6 课程接入：CURRICULUM → 词库 / 题库银行 / 动态单元岛
 * 档位映射：g1←G1+G2（16 单元）· g2←G3+G4（20）· g3←G5+G6（20）
 * g4（初中）课程 JSON 未生产 → 沿用旧 12 岛与旧词库过渡
 * ================================================================== */
var _ISLANDS_12 = THEMES.pokemon.islands; // 旧 12 岛（g4 过渡保留）
var _g4Words = WORDS.filter(function(w){ return w.grade === "g4"; }); // 旧初中词库
function curUnits(grade){
  return (window.CURRICULUM && window.CURRICULUM.grades && window.CURRICULUM.grades[grade]) || [];
}
function tierToLevel(t){ return t==="advanced" ? "培优" : t==="challenge" ? "拔高" : "基础"; }
/* 词库装配：vocab → {en,zh,grade,topic,level,unit,phonetic,example}；原有 pickWords/gradeWords 引擎零改动
   去重：同档内 en 大小写不敏感唯一（跨单元重复词保首个），避免消消乐/听力选项歧义 */
function rebuildCurriculumWords(){
  var out = [], seenEn = {};
  ["g1","g2","g3"].forEach(function(g){
    curUnits(g).forEach(function(u){
      (u.vocab||[]).forEach(function(v){
        var key = g + "|" + v.en.toLowerCase();
        if(seenEn[key]) return;
        seenEn[key] = 1;
        out.push({ en:v.en, zh:v.zh, grade:g, topic:u.title_zh,
          level:tierToLevel(v.tier), unit:u.unit_id,
          phonetic:v.phonetic||"", example:v.example||"" });
      });
    });
  });
  WORDS = out.concat(_g4Words);
  CUST_CACHE = null;
}
/* 题库银行重建：quiz 各题型 → 现有 maker 模板（makeGrammar/makeSentence/makeDaily/makeScene/makeReading/makeListen 零改动） */
function rebuildCurriculumBanks(){
  ["g1","g2","g3"].forEach(function(g){
    var grammar=[], sents=[], daily=[], scenes=[], readings=[], listen=[];
    curUnits(g).forEach(function(u){
      var q = u.quiz || {};
      (q.choice||[]).forEach(function(c){ // 选择 → 语法小课堂
        grammar.push({ q:c.stem_en, opts:c.options, a:c.answer, tip:c.explain_zh||"" });
      });
      (q.truefalse||[]).forEach(function(tf){ // 判断 → 语法小课堂（对/错二选一）
        grammar.push({ q:tf.statement_en + "（判断这句话对不对）", opts:["✓ 对","✗ 错"],
          a: tf.answer ? 0 : 1, tip:(tf.statement_zh||"") + (tf.answer ? " · 这句话是对的" : " · 这句话是错的") });
      });
      (u.vocab||[]).forEach(function(v){ // 例句 → 听力小侦探（例句与词绑定）
        if(v.example && v.example.toLowerCase().indexOf(v.en.toLowerCase())>=0) listen.push({ s:v.example, en:v.en });
      });
      (u.sentences||[]).forEach(function(sn){ // 句型操练 → 句子排排队
        if(!sn.example) return;
        var kw = "";
        (u.vocab||[]).some(function(v){ if(sn.example.toLowerCase().indexOf(v.en.toLowerCase())>=0){ kw=v.en; return true; } return false; });
        if(!kw) kw = (sn.example.replace(/[.,!?；;，。]+$/,"").split(" ")[0]) || "";
        sents.push({ s:sn.example, kw:kw });
      });
      (q.expressions||[]).forEach(function(e){ // 日常用语 → 用语剧场
        daily.push({ sc:e.scene_zh, d:["You: ___"], opts:e.options, a:e.answer, zh:e.explain_zh||"" });
      });
      (q.listening||[]).forEach(function(l){ // 听力理解 → 情景听力（TTS 播报 audio_en）
        var kw = "";
        (u.vocab||[]).some(function(v){ if(l.audio_en.toLowerCase().indexOf(v.en.toLowerCase())>=0){ kw=v.en; return true; } return false; });
        scenes.push({ sc:"听一听，选一选", d:["A: " + l.audio_en], q:l.question_zh, opts:l.options, a:l.answer, kw:kw });
      });
      (q.reading||[]).forEach(function(r){ // 阅读理解（picture_book.pages 为备选文本源，见 curriculum.js）
        var qs = (r.questions||[]).map(function(x){ return { q:x.stem_zh, opts:x.options, a:x.answer }; });
        if(!qs.length) return;
        var kw = "";
        (u.vocab||[]).some(function(v){ if(r.passage_en.toLowerCase().indexOf(v.en.toLowerCase())>=0){ kw=v.en; return true; } return false; });
        readings.push({ title:r.title_zh + " " + r.title_en, text:r.passage_en, qs:qs, gloss:{}, kw:kw });
      });
      /* spelling/dictation → 词池已覆盖（vocab 即默写词源，zh 为提示）；ordering/matching →
         sentence/memory 模板的句库/词对已由 sentences+vocab 覆盖；wordcomplete → makePuzzle 缺格模板按词生成 */
    });
    GRAMMAR[g]=grammar; SENTENCES[g]=sents; DAILY_DIALOGS[g]=daily;
    SCENE_DIALOGS[g]=scenes; READINGS[g]=readings; LISTEN_SENTENCES[g]=listen;
  });
}
/* 动态单元岛：每岛 = 1 单元，岛名 = title.zh+en；g4/无课程数据 → 旧 12 岛 */
var ISLAND_ICON_POOL = ["🔢","🌈","🌳","🍓","📚","🏠","🖐️","🛋️","⛅","⚽","🚗","💼","🎵","🍎","🔬","🌍","🎨","🧭","⚙️","🎂"];
function buildIslands(grade){
  var units = curUnits(grade);
  if(grade==="g4" || !units.length) return _ISLANDS_12;
  return units.map(function(u,i){
    return { unit:u.unit_id, name:u.title_zh, en:u.title_en,
      icon:ISLAND_ICON_POOL[i % ISLAND_ICON_POOL.length], topics:[u.title_zh] };
  });
}
function applyIslands(){
  THEMES.pokemon.islands = buildIslands(S.save ? S.save.grade : "g1");
}
/* v2.6：默写工坊/单词补全（字母块）跳过含空格的多词短语，从无空格词补位 */
function wordsForSpelling(words){
  var pool = shuffle(gradeWords().filter(function(w){ return w.en.indexOf(" ")<0 && words.indexOf(w)<0; }));
  var pi = 0;
  return words.map(function(w){ return w.en.indexOf(" ")>=0 ? (pool[pi++] || w) : w; });
}
rebuildCurriculumWords();
rebuildCurriculumBanks();
applyIslands();
loadTtsList(); /* v2.14：装载预合成词音频清单（fetch 失败/无 fetch 环境静默，落在线层） */

S.theme = "pokemon"; chooseTheme("pokemon"); // v2.5：删主题屏，直接进主流程
/* 注册硬件返回键（仅 APP 内有 Capacitor 桥；浏览器无此键） */
if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
  window.Capacitor.Plugins.App.addListener("backButton", function(){ handleBackButton(); });
}
</script>
